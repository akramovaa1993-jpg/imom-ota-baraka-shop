<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IMOM OTA BARAKA — Boshqaruv markazi</title><link rel="stylesheet" href="style.css"><style>
body{background:#eef5f1}.admin-wrap{max-width:1450px;margin:auto;padding:24px}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.admin-brand{display:flex;align-items:center;gap:14px}.admin-brand h1{margin:0;font:800 32px Georgia,serif;color:#07584c}.admin-brand p{margin:4px 0 0;color:#687971}.admin-actions{display:flex;gap:8px}.panel{background:#fff;border:1px solid #dce9e3;border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 8px 28px rgba(7,88,76,.05)}.login{max-width:680px;margin:7vh auto;padding:38px}.login h1{font:800 46px Georgia,serif;margin:0 0 8px;color:#07584c}.login p{color:#6d7d76}.login form{display:grid;gap:12px;margin-top:20px}.login input{min-height:62px;border:1px solid #cbdad3;border-radius:14px;padding:15px;font-size:18px}.login button{min-height:62px;font-size:18px}.stats-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}.stat{background:linear-gradient(145deg,#f8fcfa,#eef7f3);border:1px solid #dfebe5;border-radius:16px;padding:15px}.stat span{font-size:12px;color:#6f7f78}.stat b{display:block;font-size:23px;margin-top:5px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.tab{border:0;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer;background:#eaf2ee;color:#27483d}.tab.active{background:#07584c;color:#fff}.pane{display:none}.pane.active{display:block}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select,.toolbar textarea,.form-grid input,.form-grid select,.form-grid textarea{border:1px solid #cfded7;border-radius:10px;padding:10px 11px;background:#fff}.grow{flex:1}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:1000px}.table th,.table td{padding:10px;border-bottom:1px solid #edf2ef;text-align:left;vertical-align:top;font-size:13px}.table th{position:sticky;top:0;background:#fff;z-index:1}.status-select{padding:8px;border-radius:9px;border:1px solid #cfded7}.product-list{display:grid;gap:10px}.product-row{display:grid;grid-template-columns:120px 1.2fr .8fr .7fr .7fr .7fr .7fr .8fr auto;gap:8px;align-items:center;padding:10px;border:1px solid #e1ebe6;border-radius:14px}.product-row input,.product-row select{width:100%;border:1px solid #d2dfd9;border-radius:9px;padding:8px}.product-photo{display:grid;gap:6px;justify-items:center}.product-photo img,.product-photo .ph{width:92px;height:72px;object-fit:cover;border-radius:12px;border:1px solid #dce8e2;background:#f5faf7;display:flex;align-items:center;justify-content:center;font-size:28px}.photo-actions{display:flex;gap:5px}.photo-btn{cursor:pointer;border:1px solid #cfded7;background:#fff;border-radius:8px;padding:6px 8px;font-size:11px;font-weight:800}.photo-remove{border:0;background:#fff0f0;color:#a52828;border-radius:8px;padding:6px 8px;cursor:pointer;font-weight:800}.charts{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:12px}.chart-card{border:1px solid #e0ebe5;border-radius:16px;padding:16px}.bar-chart{display:flex;align-items:end;gap:8px;height:190px;padding-top:20px}.bar{flex:1;background:linear-gradient(#0f9d7b,#07584c);border-radius:8px 8px 0 0;min-height:4px;position:relative}.bar span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:9px;color:#6f7f78}.rank-list{display:grid;gap:8px}.rank-list div{display:grid;grid-template-columns:1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid #edf2ef}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.form-grid .wide{grid-column:1/-1}.form-grid label{display:grid;gap:5px;font-size:12px;font-weight:800;color:#4f655c}.form-grid textarea{min-height:90px}.report-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.report-card{border:1px solid #e0ebe5;border-radius:16px;padding:15px}.report-card h3{margin-top:0}.report-card input,.report-card select{width:100%;margin-bottom:8px}.promo-row{display:grid;grid-template-columns:1fr .7fr .7fr .8fr .7fr .8fr .7fr auto;gap:8px;align-items:center;margin-bottom:8px}.promo-row input,.promo-row select{width:100%;border:1px solid #d2dfd9;border-radius:9px;padding:8px}.area-editor textarea{width:100%;min-height:220px;border:1px solid #d2dfd9;border-radius:12px;padding:12px}.audit-list{max-height:420px;overflow:auto}.audit-item{display:grid;grid-template-columns:150px 120px 180px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid #edf2ef;font-size:12px}.role-badge{display:inline-block;border-radius:999px;background:#e8f5ef;color:#07584c;padding:6px 10px;font-size:12px;font-weight:800}.notice{background:#edf8f3;border:1px solid #d6eade;border-radius:12px;padding:12px;color:#31584a}.danger{background:#fff0f0!important;color:#a52828!important}.muted{color:#78877f}.small{font-size:12px}.hidden{display:none!important}.btn.sm{padding:9px 12px;border-radius:10px}.logo-admin{width:120px;height:120px;border-radius:50%;object-fit:contain;background:radial-gradient(circle at 30% 20%,#fff,#d9efe6 65%,#87b8a7);padding:14px;box-shadow:0 18px 38px rgba(7,88,76,.18)}
@media(max-width:1100px){.stats-grid{grid-template-columns:repeat(4,1fr)}.charts{grid-template-columns:1fr}.report-grid{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr 1fr}.product-row{grid-template-columns:45px 1fr 1fr 1fr}.product-row>*:nth-child(n+5){grid-column:auto}.promo-row{grid-template-columns:1fr 1fr 1fr 1fr}.admin-top{align-items:flex-start;flex-direction:column}}@media(max-width:650px){.admin-wrap{padding:12px}.stats-grid{grid-template-columns:1fr 1fr}.report-grid,.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:1}.login{padding:24px}.login h1{font-size:34px}.admin-brand h1{font-size:26px}.promo-row{grid-template-columns:1fr 1fr}.audit-item{grid-template-columns:1fr 1fr}.audit-item span:last-child{grid-column:1/-1}}

.inv-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:22px}.inv-title h2{margin:0;font-size:32px}.inv-title p{margin:6px 0 0;color:#6d7d76}.inv-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.inv-tools input,.inv-tools select{min-height:48px;border:1px solid #d5e2dc;border-radius:13px;padding:0 15px;background:#fff}.inv-tools input{min-width:300px}.inv-table-wrap{overflow:auto;border:1px solid #e0ebe5;border-radius:16px}.inv-table{width:100%;border-collapse:collapse;min-width:1180px}.inv-table th{background:#eef6f2;padding:14px 12px;text-align:left;font-size:13px;white-space:nowrap}.inv-table td{padding:10px 12px;border-top:1px solid #e8efeb;vertical-align:middle}.inv-img{width:64px;height:54px;border-radius:10px;object-fit:cover;border:1px solid #e1ebe6;background:#f5faf7}.inv-img-empty{width:64px;height:54px;border-radius:10px;border:1px dashed #cbdad3;display:flex;align-items:center;justify-content:center;color:#809087;font-size:11px}.inv-name{font-weight:800}.inv-cat,.inv-status{display:inline-flex;padding:6px 10px;border-radius:999px;background:#dcf7e9;color:#176747;font-weight:800;font-size:12px}.inv-status.sale{background:#fff0c9;color:#b76b00}.inv-status.new{background:#e1efff;color:#175ec2}.inv-actions{display:flex;gap:8px}.inv-edit,.inv-delete{border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.inv-edit{border:1px solid #bfe0d2;background:#f2fbf7;color:#08735e}.inv-delete{border:1px solid #ffcaca;background:#fff5f5;color:#d22}.inv-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-weight:800}.edit-card{margin-top:16px;border:1px solid #dce9e3;border-radius:16px;padding:16px;background:#f9fcfa}.edit-card h3{margin-top:0}.edit-grid{display:grid;grid-template-columns:120px repeat(4,1fr);gap:10px;align-items:start}.edit-grid input,.edit-grid select{width:100%;border:1px solid #d2dfd9;border-radius:9px;padding:10px}.edit-photo{grid-row:span 2}.edit-actions{display:flex;gap:8px;margin-top:12px}.inv-hidden{display:none}.inv-upload{display:inline-block;margin-top:6px;cursor:pointer;border:1px solid #cfded7;background:#fff;border-radius:8px;padding:6px 8px;font-size:11px;font-weight:800}@media(max-width:850px){.inv-head{align-items:stretch;flex-direction:column}.inv-tools input{min-width:0;flex:1}.edit-grid{grid-template-columns:1fr 1fr}.edit-photo{grid-row:auto}}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('ru-RU').format(Number(n)||0)+' so‘m', esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=null, me=null, currentTab='dashboard', reportAreas=[];
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Xatolik');return d}
async function boot(){try{me=await api('/api/admin/me');await refresh();}catch{renderLogin()}}
function renderLogin(){document.getElementById('app').innerHTML=`<div class="panel login"><div style="display:flex;align-items:center;gap:16px"><img src="logo.png" class="logo-admin"><div><span class="eyebrow">VELORA.UZ</span><h1>IMOM OTA BARAKA</h1><p>Boshqaruv markaziga kiring.</p></div></div><form onsubmit="login(event)"><input name="username" placeholder="Foydalanuvchi nomi" required><input name="password" type="password" placeholder="Parol" required><button class="btn primary">Kirish</button></form></div>`}
async function login(e){e.preventDefault();const f=new FormData(e.currentTarget);try{me=await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:f.get('username'),password:f.get('password')})});await refresh()}catch(err){alert(err.message)}}
async function logout(){await api('/api/admin/logout',{method:'POST'});renderLogin()}
async function refresh(){D=await api('/api/admin/dashboard');renderApp()}
function renderApp(){const s=D.stats, role=D.role||me?.role||'admin';document.getElementById('app').innerHTML=`<div class="admin-wrap"><div class="admin-top"><div class="admin-brand"><img src="${D.logo||'logo.png'}" class="logo-admin"><div><span class="eyebrow">VELORA.UZ</span><h1>IMOM OTA BARAKA</h1><p>Original e-commerce boshqaruv markazi • <span class="role-badge">${esc(role)}</span></p></div></div><div class="admin-actions"><a class="btn ghost" href="/" target="_blank">← Do‘konga</a><button class="btn ghost" onclick="refresh()">↻ Yangilash</button><button class="btn danger" onclick="logout()">Chiqish</button></div></div>
<div class="stats-grid"><div class="stat"><span>Barcha buyurtma</span><b>${s.orders}</b></div><div class="stat"><span>Bugun</span><b>${s.today}</b></div><div class="stat"><span>Oy</span><b>${s.month}</b></div><div class="stat"><span>Tushum</span><b>${money(s.revenue)}</b></div><div class="stat"><span>Foyda</span><b>${money(s.profit)}</b></div><div class="stat"><span>O‘rtacha chek</span><b>${money(s.avg)}</b></div><div class="stat"><span>Jarayonda</span><b>${s.pending}</b></div><div class="stat"><span>Kam qoldiq ≤5</span><b>${s.lowStock}</b></div></div>
<div class="tabs">${[['dashboard','Dashboard'],['orders','Buyurtmalar'],['products','Mahsulot / Ombor'],['customers','Mijozlar'],['reports','Hisobotlar'],['promos','Promo kodlar'],['areas','Hududlar'],['pages','Sahifalar / SEO'],['audit','Audit / Backup']].map(x=>`<button class="tab ${currentTab===x[0]?'active':''}" onclick="tab('${x[0]}')">${x[1]}</button>`).join('')}</div>
<div id="pane"></div></div>`;renderPane()}
function tab(t){currentTab=t;renderApp()}
function renderPane(){const p=$('#pane');if(currentTab==='dashboard')p.innerHTML=dashboardPane();if(currentTab==='orders')p.innerHTML=ordersPane();if(currentTab==='products')p.innerHTML=productsPane();if(currentTab==='customers')p.innerHTML=customersPane();if(currentTab==='reports')p.innerHTML=reportsPane();if(currentTab==='promos')p.innerHTML=promosPane();if(currentTab==='areas')p.innerHTML=areasPane();if(currentTab==='pages')p.innerHTML=pagesPane();if(currentTab==='audit')p.innerHTML=auditPane()}
function dashboardPane(){const c=D.charts||{},max=Math.max(1,...(c.last7||[]).map(x=>x.revenue));return `<div class="charts"><div class="panel chart-card"><h3>Oxirgi 7 kun tushumi</h3><div class="bar-chart">${(c.last7||[]).map(x=>`<div class="bar" style="height:${Math.max(4,x.revenue/max*150)}px" title="${money(x.revenue)}"><span>${x.date.slice(5)}</span></div>`).join('')}</div></div><div class="panel chart-card"><h3>Top mahsulotlar</h3><div class="rank-list">${(c.topProducts||[]).map((x,i)=>`<div><span>${i+1}. ${esc(x.name)}</span><b>${x.qty} dona</b></div>`).join('')||'<p class="muted">Hali ma’lumot yo‘q</p>'}</div></div><div class="panel chart-card"><h3>Top hududlar</h3><div class="rank-list">${(c.areas||[]).map((x,i)=>`<div><span>${i+1}. ${esc(x.name)}</span><b>${x.count}</b></div>`).join('')||'<p class="muted">Hali ma’lumot yo‘q</p>'}</div></div></div><div class="panel"><h3>Tezkor holat</h3><div class="notice">Yangi buyurtmalar Telegram va admin panelda sinxron ishlaydi. Yakunlangan buyurtmalar tushum va foyda hisobiga kiradi.</div></div>`}
function ordersPane(){return `<div class="panel"><div class="toolbar"><input id="orderSearch" class="grow" placeholder="Buyurtma, mijoz yoki telefon bo‘yicha qidirish" oninput="filterOrders()"><select id="orderStatus" onchange="filterOrders()"><option value="">Barcha statuslar</option><option value="new">Yangi</option><option value="accepted">Qabul qilindi</option><option value="delivery">Yetkazilmoqda</option><option value="done">Yakunlandi</option><option value="cancelled">Bekor qilindi</option></select></div><div class="table"><table><thead><tr><th>Buyurtma</th><th>Mijoz</th><th>Hudud / Manzil</th><th>Mahsulot</th><th>Jami</th><th>Sana</th><th>Status</th></tr></thead><tbody id="ordersBody">${orderRows(D.orders)}</tbody></table></div></div>`}
function orderRows(arr){return arr.map(o=>`<tr data-search="${esc((o.orderId+' '+o.customer?.name+' '+o.customer?.phone).toLowerCase())}" data-status="${o.status}"><td><b>${esc(o.orderId)}</b><br><small>${esc(o.customer?.payment||'')}</small></td><td>${esc(o.customer?.name||'')}<br><a href="tel:${esc(o.customer?.phone||'')}">${esc(o.customer?.phone||'')}</a></td><td><b>${esc(o.customer?.area||'')}</b><br>${esc(o.customer?.address||'')}<br><small>${esc(o.customer?.deliverySlot||'')}</small>${o.customer?.lat&&o.customer?.lng?`<br><a target="_blank" href="https://maps.google.com/?q=${o.customer.lat},${o.customer.lng}">📍 Xaritada ochish</a>`:''}</td><td>${(o.items||[]).map(i=>`${esc(i.name)} × ${i.qty}`).join('<br>')}</td><td><b>${money(o.total)}</b>${o.discount?`<br><small>−${money(o.discount)}</small>`:''}</td><td>${new Date(o.createdAt).toLocaleString('uz-UZ')}</td><td><select class="status-select" onchange="setStatus('${o.orderId}',this.value)">${[['new','🕓 Yangi'],['accepted','✅ Qabul qilindi'],['delivery','🚚 Yetkazilmoqda'],['done','📦 Yakunlandi'],['cancelled','❌ Bekor qilindi']].map(x=>`<option value="${x[0]}" ${o.status===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></td></tr>`).join('')}
function filterOrders(){const q=$('#orderSearch').value.toLowerCase(),st=$('#orderStatus').value;[...$('#ordersBody').children].forEach(tr=>tr.style.display=(!q||tr.dataset.search.includes(q))&&(!st||tr.dataset.status===st)?'':'none')}
async function setStatus(id,status){try{await api(`/api/admin/orders/${id}/status`,{method:'PATCH',body:JSON.stringify({status})});await refresh()}catch(e){alert(e.message)}}
function productsPane(){return `<div class="panel"><div class="inv-head"><div class="inv-title"><h2>Mahsulotlar / Ombor</h2><p>Mahsulotlar ro‘yxatini boshqaring, narx, zaxira va rasmlarini tahrirlang.</p></div><div class="inv-tools"><input id="invSearch" placeholder="Mahsulot nomi bo‘yicha qidirish..." oninput="filterInventory()"><select id="invCat" onchange="filterInventory()"><option value="">Barcha kategoriyalar</option>${D.categories.map(c=>`<option value="${c.id}">${esc(c.name?.uz||c.id)}</option>`).join('')}</select><button class="btn primary" onclick="createProductAndOpen()">+ Mahsulot qo‘shish</button></div></div><div class="inv-table-wrap"><table class="inv-table"><thead><tr><th>#</th><th>Rasm</th><th>Mahsulot nomi</th><th>Kategoriya</th><th>Sotuv narxi</th><th>Tannarx</th><th>Eski narx</th><th>Zaxira</th><th>Holat</th><th>Amallar</th></tr></thead><tbody id="invBody">${D.products.map((p,i)=>inventoryRow(p,i)).join('')}</tbody></table></div><div class="inv-foot"><span>Jami: ${D.products.length} ta mahsulot</span><span>1</span></div></div><div id="productModalRoot"></div>`}
function inventoryRow(p,i){const c=D.categories.find(x=>x.id===p.cat);const st=(p.badge||'Faol');const cls=/aksiya/i.test(st)?'sale':/yangi/i.test(st)?'new':'';return `<tr class="inv-row" data-name="${esc((p.name?.uz||'').toLowerCase())}" data-cat="${esc(p.cat||'')}"><td>${i+1}</td><td>${p.image?`<img class="inv-img" src="${p.image}" alt="">`:`<div class="inv-img-empty">Rasm yo‘q</div>`}</td><td class="inv-name">${esc(p.name?.uz||'')}</td><td><span class="inv-cat">${esc(c?.name?.uz||p.cat||'')}</span></td><td>${money(p.price)}</td><td>${money(p.cost||0)}</td><td>${p.oldPrice?money(p.oldPrice):'—'}</td><td>${Number(p.stock||0)}</td><td><span class="inv-status ${cls}">${esc(st)}</span></td><td><div class="inv-actions"><button class="inv-edit" onclick="openProductEditor(${p.id})">Tahrirlash</button><button class="inv-delete" onclick="removeProduct(${p.id})">O‘chirish</button></div></td></tr>`}
function filterInventory(){const q=($('#invSearch')?.value||'').toLowerCase(),cat=$('#invCat')?.value||'';document.querySelectorAll('.inv-row').forEach(r=>r.style.display=(!q||r.dataset.name.includes(q))&&(!cat||r.dataset.cat===cat)?'':'none')}
function createProductAndOpen(){const p={id:Date.now(),cat:D.categories[0]?.id||'food',emoji:'',name:{uz:'Yangi mahsulot',ru:'Новый товар',en:'New product'},price:0,cost:0,oldPrice:0,stock:0,image:'',badge:'YANGI',featured:false};D.products.push(p);openProductEditor(p.id,true)}
function closeProductEditor(removeUnsaved=false,id=null){if(removeUnsaved&&id){const p=D.products.find(x=>Number(x.id)===Number(id));if(p&&p.name?.uz==='Yangi mahsulot'&&Number(p.price||0)===0)D.products=D.products.filter(x=>Number(x.id)!==Number(id))}const r=$('#productModalRoot');if(r)r.innerHTML=''}
function openProductEditor(id,isNew=false){const p=D.products.find(x=>Number(x.id)===Number(id));if(!p)return;const r=$('#productModalRoot')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'productModalRoot'}));r.innerHTML=`<div class="product-modal" onclick="if(event.target===this)closeProductEditor(${isNew?'true':'false'},${p.id})"><div class="product-modal-card"><div class="product-modal-head"><div><h3>${isNew?'Yangi mahsulot qo‘shish':'Mahsulotni tahrirlash'}</h3><div class="muted small">Mahsulot ma’lumotlari va rasmini shu oynada kiriting.</div></div><button class="product-modal-close" onclick="closeProductEditor(${isNew?'true':'false'},${p.id})">×</button></div><div class="product-modal-grid"><div class="product-modal-photo">${p.image?`<img class="inv-img" src="${p.image}" alt="Mahsulot rasmi">`:`<div class="inv-img-empty">Rasm yo‘q</div>`}<label class="inv-upload">Rasm tanlash<input type="file" accept="image/jpeg,image/png,image/webp" hidden onchange="setProductImage(${p.id},event);setTimeout(()=>openProductEditor(${p.id},${isNew?'true':'false'}),80)"></label>${p.image?`<button class="photo-remove" onclick="removeProductImage(${p.id});openProductEditor(${p.id},${isNew?'true':'false'})" type="button">Rasmni olib tashlash</button>`:''}</div><label>Mahsulot nomi<input id="eName" value="${esc(p.name?.uz||'')}"></label><label>Kategoriya<select id="eCat">${D.categories.map(c=>`<option value="${c.id}" ${c.id===p.cat?'selected':''}>${esc(c.name?.uz||c.id)}</option>`).join('')}</select></label><label>Sotuv narxi<input id="ePrice" type="number" min="0" value="${p.price||0}"></label><label>Tannarx<input id="eCost" type="number" min="0" value="${p.cost||0}"></label><label>Eski narx<input id="eOld" type="number" min="0" value="${p.oldPrice||0}"></label><label>Zaxira<input id="eStock" type="number" min="0" value="${p.stock||0}"></label><label>Holat<input id="eBadge" value="${esc(p.badge||'Faol')}" placeholder="Faol / YANGI / AKSIYA / TOP"></label></div><div class="product-modal-actions"><button class="btn ghost sm" onclick="closeProductEditor(${isNew?'true':'false'},${p.id})">Bekor qilish</button><button class="btn primary sm" onclick="applyProductEdit(${p.id})">Saqlash</button></div></div></div>`}
function applyProductEdit(id){const p=D.products.find(x=>Number(x.id)===Number(id));if(!p)return;p.name.uz=$('#eName').value.trim()||'Mahsulot';p.name.ru=p.name.ru||p.name.uz;p.name.en=p.name.en||p.name.uz;p.cat=$('#eCat').value;p.price=Number($('#ePrice').value);p.cost=Number($('#eCost').value);p.oldPrice=Number($('#eOld').value);p.stock=Number($('#eStock').value);p.badge=$('#eBadge').value.trim()||'Faol';saveProductsDirect()}
async function saveProductsDirect(){try{await api('/api/admin/catalog',{method:'PUT',body:JSON.stringify({products:D.products,categories:D.categories,settings:D.settings,logo:D.logo})});closeProductEditor();alert('Saqlandi');await refresh()}catch(e){alert(e.message)}}
function productRow(p){return `<div class="product-row" data-id="${p.id}"><div class="product-photo" id="photo-${p.id}">${p.image?`<img src="${p.image}" alt="Mahsulot rasmi">`:`<div class="ph">Rasm yo‘q</div>`}<div class="photo-actions"><label class="photo-btn">Rasm qo‘shish<input type="file" accept="image/jpeg,image/png,image/webp" hidden onchange="setProductImage(${p.id},event)"></label>${p.image?`<button class="photo-remove" onclick="removeProductImage(${p.id})" type="button">×</button>`:''}</div></div><input class="pname" value="${esc(p.name?.uz||'')}" placeholder="Mahsulot nomi"><select class="pcat">${D.categories.map(c=>`<option value="${c.id}" ${c.id===p.cat?'selected':''}>${esc(c.name?.uz||c.id)}</option>`).join('')}</select><input class="pprice" type="number" value="${p.price}" placeholder="Narx"><input class="pcost" type="number" value="${p.cost||0}" placeholder="Tannarx"><input class="pold" type="number" value="${p.oldPrice||0}" placeholder="Eski narx"><input class="pstock" type="number" value="${p.stock}" placeholder="Qoldiq"><input class="pbadge" value="${esc(p.badge||'')}" placeholder="Badge"><button class="btn danger sm" onclick="removeProduct(${p.id})">×</button></div>`}
function addProduct(){D.products.push({id:Date.now(),cat:D.categories[0]?.id||'food',emoji:'',name:{uz:'Yangi mahsulot',ru:'Новый товар',en:'New product'},price:0,cost:0,oldPrice:0,stock:0,image:'',badge:'YANGI',featured:false});renderPane()}
function setProductImage(id,e){const file=e.target.files?.[0];if(!file)return;if(!/^image\/(jpeg|png|webp)$/.test(file.type)){alert('Faqat JPG, PNG yoki WEBP rasm tanlang.');e.target.value='';return}if(file.size>8*1024*1024){alert('Rasm 8 MB dan katta bo‘lmasin.');e.target.value='';return}const img=new Image(),reader=new FileReader();reader.onload=()=>{img.onload=()=>{const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);let data='';try{data=c.toDataURL('image/webp',.82)}catch{data=c.toDataURL('image/jpeg',.84)}const p=D.products.find(x=>Number(x.id)===Number(id));if(p){p.image=data;renderPane()}};img.onerror=()=>alert('Rasmni o‘qib bo‘lmadi.');img.src=reader.result};reader.readAsDataURL(file)}
function removeProductImage(id){const p=D.products.find(x=>Number(x.id)===Number(id));if(p){p.image='';renderPane()}}
function removeProduct(id){if(!confirm('Mahsulot o‘chirilsinmi?'))return;D.products=D.products.filter(x=>Number(x.id)!==Number(id));saveProductsDirect()}
async function saveProducts(){document.querySelectorAll('.product-row').forEach(r=>{const p=D.products.find(x=>Number(x.id)===Number(r.dataset.id));if(!p)return;p.name.uz=r.querySelector('.pname').value;p.name.ru=p.name.ru||p.name.uz;p.name.en=p.name.en||p.name.uz;p.cat=r.querySelector('.pcat').value;p.price=Number(r.querySelector('.pprice').value);p.cost=Number(r.querySelector('.pcost').value);p.oldPrice=Number(r.querySelector('.pold').value);p.stock=Number(r.querySelector('.pstock').value);p.badge=r.querySelector('.pbadge').value});try{await api('/api/admin/catalog',{method:'PUT',body:JSON.stringify({products:D.products,categories:D.categories,settings:D.settings,logo:D.logo})});alert('Saqlandi');await refresh()}catch(e){alert(e.message)}}
function customersPane(){return `<div class="panel"><div class="table"><table><thead><tr><th>Mijoz</th><th>Telefon</th><th>Buyurtmalar</th><th>Yakunlangan xarid</th><th>Oxirgi buyurtma</th><th>Asosiy hudud</th></tr></thead><tbody>${D.customers.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td><a href="tel:${esc(c.phone)}">${esc(c.phone)}</a></td><td>${c.orders}</td><td><b>${money(c.total)}</b></td><td>${c.lastOrder?new Date(c.lastOrder).toLocaleString('uz-UZ'):''}</td><td>${esc(Object.entries(c.areas||{}).sort((a,b)=>b[1]-a[1])[0]?.[0]||'')}</td></tr>`).join('')}</tbody></table></div></div>`}
function reportsPane(){const today=new Date().toISOString().slice(0,10),month=today.slice(0,7),year=today.slice(0,4);return `<div class="report-grid"><div class="report-card"><h3>Kunlik hisobot</h3><input id="rday" type="date" value="${today}"><button class="btn primary sm" onclick="report('daily',$('#rday').value)">Excel yuklash</button></div><div class="report-card"><h3>Oylik hisobot</h3><input id="rmonth" type="month" value="${month}"><button class="btn primary sm" onclick="report('monthly',$('#rmonth').value)">Excel yuklash</button></div><div class="report-card"><h3>Yillik hisobot</h3><input id="ryear" type="number" value="${year}" min="2020" max="2100"><button class="btn primary sm" onclick="report('yearly',$('#ryear').value)">Excel yuklash</button></div><div class="report-card"><h3>Sana oralig‘i</h3><input id="rfrom" type="date"><input id="rto" type="date"><select id="rstatus"><option value="">Barcha statuslar</option><option value="done">Yakunlangan</option><option value="cancelled">Bekor qilingan</option></select><button class="btn primary sm" onclick="customReport()">Excel yuklash</button></div></div><div class="panel"><h3>Hisobot tarkibi</h3><p class="muted">Buyurtma, sana, mijoz, telefon, Parkent hududi, manzil, yetkazish vaqti, mahsulotlar, chegirma, tushum, tannarx, foyda va status.</p></div>`}
function report(period,value){window.location=`/api/admin/reports.xls?period=${encodeURIComponent(period)}&value=${encodeURIComponent(value)}`}
function customReport(){window.location=`/api/admin/reports.xls?period=custom&from=${encodeURIComponent($('#rfrom').value)}&to=${encodeURIComponent($('#rto').value)}&status=${encodeURIComponent($('#rstatus').value)}`}
function promosPane(){return `<div class="panel"><div class="toolbar"><button class="btn primary sm" onclick="addPromo()">+ Promo kod</button><button class="btn ghost sm" onclick="savePromos()">Saqlash</button></div><div id="promoList">${D.promos.map((p,i)=>promoRow(p,i)).join('')}</div></div>`}
function promoRow(p,i){return `<div class="promo-row" data-i="${i}"><input class="code" value="${esc(p.code)}" placeholder="KOD"><select class="type"><option value="percent" ${p.type==='percent'?'selected':''}>%</option><option value="fixed" ${p.type==='fixed'?'selected':''}>So‘m</option></select><input class="value" type="number" value="${p.value}" placeholder="Qiymat"><input class="min" type="number" value="${p.minTotal||0}" placeholder="Min summa"><input class="limit" type="number" value="${p.usageLimit||0}" placeholder="Limit"><input class="expires" type="date" value="${esc(p.expires||'')}"><select class="active"><option value="1" ${p.active?'selected':''}>Faol</option><option value="0" ${!p.active?'selected':''}>O‘chiq</option></select><button class="btn danger sm" onclick="removePromo(${i})">×</button></div>`}
function addPromo(){D.promos.push({code:'YANGI10',type:'percent',value:10,minTotal:0,active:true,usageLimit:100,used:0,expires:''});renderPane()}
function removePromo(i){D.promos.splice(i,1);renderPane()}
async function savePromos(){document.querySelectorAll('.promo-row').forEach(r=>{const p=D.promos[Number(r.dataset.i)];p.code=r.querySelector('.code').value.toUpperCase();p.type=r.querySelector('.type').value;p.value=Number(r.querySelector('.value').value);p.minTotal=Number(r.querySelector('.min').value);p.usageLimit=Number(r.querySelector('.limit').value);p.expires=r.querySelector('.expires').value;p.active=r.querySelector('.active').value==='1'});try{await api('/api/admin/promos',{method:'PUT',body:JSON.stringify({promos:D.promos})});alert('Promo kodlar saqlandi');await refresh()}catch(e){alert(e.message)}}
function areasPane(){return `<div class="panel area-editor"><h3>Parkent tumani yetkazib berish hududlari</h3><p class="muted">Har bir hududni alohida qatorda yozing. Mijoz checkoutda shu ro‘yxatdan majburiy tanlaydi. Yetkazib berish bepul.</p><textarea id="areasText">${esc((D.settings.delivery?.areas||[]).join('\n'))}</textarea><h3>Yetkazish vaqt oralig‘i</h3><textarea id="slotsText" style="min-height:120px">${esc((D.settings.delivery?.slots||[]).join('\n'))}</textarea><button class="btn primary" onclick="saveAreas()">Hududlarni saqlash</button></div>`}
async function saveAreas(){D.settings.delivery=D.settings.delivery||{};D.settings.delivery.free=true;D.settings.delivery.district='Parkent tumani';D.settings.delivery.areas=$('#areasText').value.split('\n').map(x=>x.trim()).filter(Boolean);D.settings.delivery.slots=$('#slotsText').value.split('\n').map(x=>x.trim()).filter(Boolean);await saveSettings('Hududlar saqlandi')}
function pagesPane(){const s=D.settings;return `<div class="panel"><div class="form-grid"><h3 class="wide">Brend va sayt</h3><label>Sayt nomi<input id="siteName" value="${esc(s.siteName||'')}"></label><label>Domen<input id="siteDomain" value="${esc(s.siteDomain||'')}"></label><label>Dizayn<select id="theme"><option value="original" ${s.theme==='original'?'selected':''}>Original</option><option value="modern" ${s.theme==='modern'?'selected':''}>Modern</option><option value="classic" ${s.theme==='classic'?'selected':''}>Classic</option></select></label><label>Telefon<input id="phone" value="${esc(s.phone||'')}"></label><label>Telegram<input id="telegram" value="${esc(s.telegram||'')}"></label><label>Email<input id="email" value="${esc(s.email||'')}"></label><h3 class="wide">Bosh sahifa (UZ)</h3><label class="wide">Hero sarlavha<input id="heroTitle" value="${esc(s.hero?.uz?.title||'')}"></label><label class="wide">Hero matn<textarea id="heroText">${esc(s.hero?.uz?.text||'')}</textarea></label><h3 class="wide">Biz haqimizda (UZ)</h3><label class="wide">Sarlavha<input id="aboutTitle" value="${esc(s.about?.uz?.title||'')}"></label><label class="wide">Matn<textarea id="aboutText">${esc(s.about?.uz?.text||'')}</textarea></label><h3 class="wide">Aloqa (UZ)</h3><label class="wide">Sarlavha<input id="contactTitle" value="${esc(s.contact?.uz?.title||'')}"></label><label class="wide">Matn<textarea id="contactText">${esc(s.contact?.uz?.text||'')}</textarea></label><h3 class="wide">SEO</h3><label class="wide">Meta title<input id="seoTitle" value="${esc(s.seo?.title||'')}"></label><label class="wide">Meta description<textarea id="seoDesc">${esc(s.seo?.description||'')}</textarea></label><label class="wide">Keywords<input id="seoKeywords" value="${esc(s.seo?.keywords||'')}"></label></div><button class="btn primary" onclick="savePages()">Sahifalarni saqlash</button></div>`}
async function savePages(){const s=D.settings;s.siteName=$('#siteName').value;s.siteDomain=$('#siteDomain').value;s.theme=$('#theme').value;s.phone=$('#phone').value;s.telegram=$('#telegram').value;s.email=$('#email').value;s.hero=s.hero||{};s.hero.uz=s.hero.uz||{};s.hero.uz.title=$('#heroTitle').value;s.hero.uz.text=$('#heroText').value;s.about=s.about||{};s.about.uz=s.about.uz||{};s.about.uz.title=$('#aboutTitle').value;s.about.uz.text=$('#aboutText').value;s.contact=s.contact||{};s.contact.uz=s.contact.uz||{};s.contact.uz.title=$('#contactTitle').value;s.contact.uz.text=$('#contactText').value;s.seo=s.seo||{};s.seo.title=$('#seoTitle').value;s.seo.description=$('#seoDesc').value;s.seo.keywords=$('#seoKeywords').value;await saveSettings('Sahifalar va SEO saqlandi')}
async function saveSettings(msg){try{await api('/api/admin/catalog',{method:'PUT',body:JSON.stringify({products:D.products,categories:D.categories,settings:D.settings,logo:D.logo})});alert(msg);await refresh()}catch(e){alert(e.message)}}
function auditPane(){return `<div class="panel"><div class="toolbar"><a class="btn primary sm" href="/api/admin/backup.json">Backup yuklash</a><label class="btn ghost sm">Backup tiklash<input id="restoreFile" type="file" accept="application/json" hidden onchange="restoreBackup(event)"></label></div><div class="notice">Audit log admin, operator, Telegram va mijoz tomonidan bajarilgan asosiy harakatlarni qayd qiladi.</div><div class="audit-list">${D.audit.map(a=>`<div class="audit-item"><span>${new Date(a.at).toLocaleString('uz-UZ')}</span><b>${esc(a.user)}</b><span>${esc(a.action)}</span><span>${esc(a.details)}</span></div>`).join('')}</div></div>`}
async function restoreBackup(e){const f=e.target.files[0];if(!f)return;if(!confirm('Backupni tiklash joriy ma’lumotlarni almashtiradi. Davom etasizmi?'))return;try{const txt=await f.text();const data=JSON.parse(txt);await api('/api/admin/restore',{method:'POST',body:JSON.stringify(data)});alert('Backup tiklandi');await refresh()}catch(err){alert(err.message)}}
boot();
</script></body></html>
