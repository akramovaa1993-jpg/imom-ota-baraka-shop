<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imom Ota Baraka — Online Admin</title><link rel="stylesheet" href="style.css"><style>
body{background:#f4f7f4}.wrap{max-width:1280px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.box{background:#fff;border:1px solid #dce5df;border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 8px 30px rgba(0,0,0,.05)}.login{max-width:430px;margin:10vh auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#f8fbf9;border:1px solid #e0e8e3;border-radius:16px;padding:16px}.stat b{font-size:26px;display:block;margin-top:5px}.row{display:flex;gap:10px;flex-wrap:wrap}.row input,.row select,.row textarea,.box input,.box select,.box textarea{padding:11px;border:1px solid #cfd9d2;border-radius:10px;font:inherit}.grow{flex:1}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{border:0;border-radius:999px;padding:10px 15px;cursor:pointer}.tab.active{background:#123f2a;color:#fff}.pane{display:none}.pane.active{display:block}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:11px;border-bottom:1px solid #edf1ee;text-align:left;vertical-align:top}.badge{padding:5px 9px;border-radius:999px;background:#eef5f0;white-space:nowrap}.small{font-size:12px;color:#66736b}.danger{background:#fff0f0!important;color:#a82424!important}.product-card{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #edf1ee}.product-card img{width:54px;height:54px;object-fit:cover;border-radius:10px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.wide{grid-column:1/-1}.notice{background:#edf7f1;padding:12px;border-radius:12px;color:#24533b}.hidden{display:none!important}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.product-card{grid-template-columns:50px 1fr}.product-card .actions{grid-column:2}.top{align-items:flex-start;flex-direction:column}}
</style></head><body>
<div id="loginView" class="login box"><h1>🔐 Online admin</h1><p>Do‘kon boshqaruv paneliga kiring.</p><form id="loginForm"><input id="loginUser" placeholder="Login" value="admin" required style="width:100%;margin-bottom:10px"><input id="loginPass" type="password" placeholder="Parol" required style="width:100%;margin-bottom:10px"><button class="btn primary" style="width:100%">Kirish</button><p id="loginMsg" class="small"></p></form></div>
<div id="appView" class="wrap hidden"><div class="top"><div><span class="eyebrow">IMOM OTA BARAKA</span><h1 style="margin:.2em 0">Online boshqaruv paneli</h1></div><div class="row"><a class="btn ghost" href="index.html">← Do‘konga</a><button id="logout" class="btn danger">Chiqish</button></div></div>
<div class="grid" id="stats"></div>
<div class="tabs"><button class="tab active" data-tab="orders">📦 Buyurtmalar</button><button class="tab" data-tab="products">🛍️ Mahsulotlar / Ombor</button><button class="tab" data-tab="categories">📂 Kategoriyalar</button><button class="tab" data-tab="settings">🌐 Sayt sozlamalari</button></div>
<div id="orders" class="pane active box"><div class="row"><input id="orderSearch" class="grow" placeholder="Buyurtma, mijoz yoki telefon bo‘yicha qidirish"><select id="orderStatus"><option value="all">Barcha statuslar</option><option value="new">Yangi</option><option value="accepted">Qabul qilindi</option><option value="delivery">Yetkazilmoqda</option><option value="done">Yakunlandi</option><option value="cancelled">Bekor qilindi</option></select></div><div id="ordersTable" class="table" style="margin-top:12px"></div></div>
<div id="products" class="pane box"><h2>Yangi mahsulot</h2><div class="formgrid"><input id="pUz" placeholder="Nomi — UZ"><input id="pRu" placeholder="Название — RU"><input id="pEn" placeholder="Name — EN"><input id="pPrice" type="number" placeholder="Narxi"><input id="pStock" type="number" placeholder="Qoldiq" value="0"><select id="pCat"></select><input id="pEmoji" placeholder="Emoji" value="🛍️"><input id="pImage" class="wide" type="file" accept="image/*"><button id="addProduct" class="btn primary wide">+ Mahsulot qo‘shish</button></div><h2>Mahsulotlar</h2><div id="productList"></div></div>
<div id="categories" class="pane box"><h2>Kategoriyalar</h2><div class="row"><input id="cUz" placeholder="UZ nomi"><input id="cRu" placeholder="RU nomi"><input id="cEn" placeholder="EN nomi"><input id="cIcon" placeholder="Emoji" value="🛍️"><button id="addCat" class="btn primary">+ Qo‘shish</button></div><div id="catList" style="margin-top:15px"></div></div>
<div id="settings" class="pane box"><p class="notice">Bu sozlamalar endi serverda saqlanadi va barcha qurilmalarda bir xil ko‘rinadi.</p><div class="formgrid"><input id="sHeroUz" placeholder="Bosh sahifa sarlavhasi UZ"><input id="sHeroRu" placeholder="RU"><input id="sHeroEn" placeholder="EN"><textarea id="sAboutUz" class="wide" placeholder="Biz haqimizda UZ"></textarea><input id="sPhone" placeholder="Telefon"><input id="sTelegram" placeholder="Telegram"><input id="sEmail" placeholder="Email"><button id="saveSettings" class="btn primary wide">Sozlamalarni saqlash</button></div></div>
</div>
<script>
let data={orders:[],products:[],categories:[],settings:{},logo:'',stats:{}};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('ru-RU').format(Number(n)||0)+' so‘m';
const labels={new:'🕓 Yangi',accepted:'✅ Qabul qilindi',delivery:'🚚 Yetkazilmoqda',done:'📦 Yakunlandi',cancelled:'❌ Bekor qilindi'};
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const j=await r.json().catch(()=>({}));if(r.status===401){showLogin();throw new Error('Unauthorized')}if(!r.ok)throw new Error(j.error||'Xatolik');return j}
function showLogin(){ $('loginView').classList.remove('hidden');$('appView').classList.add('hidden') } function showApp(){ $('loginView').classList.add('hidden');$('appView').classList.remove('hidden') }
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('loginUser').value,password:$('loginPass').value})});$('loginMsg').textContent='';await load()}catch(x){$('loginMsg').textContent=x.message}};
$('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'}).catch(()=>{});showLogin()};
async function load(){data=await api('/api/admin/dashboard');showApp();renderAll()}
function renderAll(){renderStats();renderOrders();renderProducts();renderCats();fillSettings()}
function renderStats(){const s=data.stats;$('stats').innerHTML=[['Barcha buyurtma',s.orders],['Bugun',s.today],['Yakunlangan tushum',money(s.revenue)],['Jarayonda',s.pending],['Bekor qilingan',s.cancelled],['Kam qoldiq ≤5',s.lowStock]].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}
function renderOrders(){const q=$('orderSearch').value.toLowerCase(),st=$('orderStatus').value;const arr=data.orders.filter(o=>(st==='all'||o.status===st)&&(!q||JSON.stringify(o).toLowerCase().includes(q)));$('ordersTable').innerHTML=`<table><thead><tr><th>Buyurtma</th><th>Mijoz</th><th>Mahsulot</th><th>Jami</th><th>Sana</th><th>Status</th></tr></thead><tbody>${arr.map(o=>`<tr><td><b>${esc(o.orderId)}</b><div class="small">${esc(o.customer?.address||'')}</div></td><td>${esc(o.customer?.name)}<br><a href="tel:${esc(o.customer?.phone)}">${esc(o.customer?.phone)}</a></td><td>${(o.items||[]).map(x=>`${esc(x.name)} × ${x.qty||1}`).join('<br>')}</td><td><b>${money(o.total)}</b></td><td>${new Date(o.createdAt).toLocaleString('uz-UZ')}</td><td><select onchange="setStatus('${esc(o.orderId)}',this.value)">${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${v}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table>`}
$('orderSearch').oninput=renderOrders;$('orderStatus').onchange=renderOrders;
async function setStatus(id,status){await api('/api/admin/orders/'+encodeURIComponent(id)+'/status',{method:'PATCH',body:JSON.stringify({status})});await load()}
function catOptions(sel){return data.categories.map(c=>`<option value="${esc(c.id)}" ${c.id===sel?'selected':''}>${esc(c.icon||'')} ${esc(c.name?.uz)}</option>`).join('')}
function renderProducts(){$('pCat').innerHTML=catOptions();$('productList').innerHTML=data.products.map((p,i)=>`<div class="product-card"><div>${p.image?`<img src="${p.image}">`:`<div style="font-size:34px">${esc(p.emoji)}</div>`}</div><div><b>${esc(p.name?.uz)}</b><div class="small">${money(p.price)} • Qoldiq: <b>${p.stock}</b></div></div><div class="actions row"><button class="btn ghost" onclick="editProduct(${i})">Tahrirlash</button><button class="btn danger" onclick="deleteProduct(${i})">O‘chirish</button></div></div>`).join('')}
function fileData(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
$('addProduct').onclick=async()=>{const uz=$('pUz').value.trim();if(!uz)return alert('Mahsulot nomini kiriting');const image=await fileData($('pImage').files[0]);data.products.push({id:Date.now(),cat:$('pCat').value,emoji:$('pEmoji').value||'🛍️',name:{uz,ru:$('pRu').value.trim()||uz,en:$('pEn').value.trim()||uz},price:Number($('pPrice').value)||0,stock:Number($('pStock').value)||0,image});await saveCatalog();['pUz','pRu','pEn','pPrice'].forEach(x=>$(x).value='');$('pStock').value=0;$('pImage').value=''};
async function editProduct(i){const p=data.products[i];const price=prompt('Narxi:',p.price);if(price===null)return;const stock=prompt('Qoldiq:',p.stock);if(stock===null)return;const uz=prompt('Nomi UZ:',p.name.uz);if(uz===null)return;p.price=Number(price)||0;p.stock=Math.max(0,Number(stock)||0);p.name.uz=uz.trim()||p.name.uz;await saveCatalog()}
async function deleteProduct(i){if(!confirm('Mahsulot o‘chirilsinmi?'))return;data.products.splice(i,1);await saveCatalog()}
function renderCats(){$('catList').innerHTML=data.categories.map((c,i)=>`<div class="product-card"><div style="font-size:34px">${esc(c.icon)}</div><div><b>${esc(c.name?.uz)}</b><div class="small">${esc(c.name?.ru)} / ${esc(c.name?.en)} • ${esc(c.id)}</div></div><div class="actions"><button class="btn danger" onclick="deleteCat(${i})">O‘chirish</button></div></div>`).join('')}
function slug(s){return s.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'cat-'+Date.now()}
$('addCat').onclick=async()=>{const uz=$('cUz').value.trim();if(!uz)return;let id=slug(uz);if(data.categories.some(c=>c.id===id))id+='-'+Date.now().toString().slice(-4);data.categories.push({id,icon:$('cIcon').value||'🛍️',name:{uz,ru:$('cRu').value.trim()||uz,en:$('cEn').value.trim()||uz}});await saveCatalog()};
async function deleteCat(i){if(data.categories.length<=1)return alert('Kamida 1 kategoriya qolishi kerak');const c=data.categories[i],target=data.categories.find((x,j)=>j!==i);if(!confirm('Kategoriya o‘chirilsinmi?'))return;data.products.forEach(p=>{if(p.cat===c.id)p.cat=target.id});data.categories.splice(i,1);await saveCatalog()}
function fillSettings(){const s=data.settings||{};$('sHeroUz').value=s.hero?.uz?.title||'';$('sHeroRu').value=s.hero?.ru?.title||'';$('sHeroEn').value=s.hero?.en?.title||'';$('sAboutUz').value=s.about?.uz?.text||'';$('sPhone').value=s.phone||'';$('sTelegram').value=s.telegram||'';$('sEmail').value=s.email||''}
$('saveSettings').onclick=async()=>{data.settings.hero=data.settings.hero||{};for(const l of ['uz','ru','en'])data.settings.hero[l]=data.settings.hero[l]||{};data.settings.hero.uz.title=$('sHeroUz').value;data.settings.hero.ru.title=$('sHeroRu').value;data.settings.hero.en.title=$('sHeroEn').value;data.settings.about=data.settings.about||{};data.settings.about.uz=data.settings.about.uz||{};data.settings.about.uz.text=$('sAboutUz').value;data.settings.phone=$('sPhone').value;data.settings.telegram=$('sTelegram').value;data.settings.email=$('sEmail').value;await saveCatalog();alert('Saqlandi')};
async function saveCatalog(){await api('/api/admin/catalog',{method:'PUT',body:JSON.stringify({products:data.products,categories:data.categories,settings:data.settings,logo:data.logo})});await load()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))});
api('/api/admin/me').then(load).catch(()=>showLogin());
</script></body></html>
