m" title="Kamchilikni ko‘rish" onclick="showOrderComplaint('${esc(o.orderId)}')">⚠</button>`:''}<button class="order-delete-icon" title="Buyurtmani o‘chirish" aria-label="Buyurtmani o‘chirish" onclick="deleteOrder('${o.orderId}',this)">🗑️</button></td></tr>`}).join('')}
function filterOrders(){const q=$('#orderSearch').value.toLowerCase(),st=$('#orderStatus').value;[...$('#ordersBody').children].forEach(tr=>tr.style.display=(!q||tr.dataset.search.includes(q))&&(!st||tr.dataset.status===st)?'':'none')}

function requestsPane(){const a=D.productRequests||[];return `<div class="panel"><div class="inv-head"><div class="inv-title"><h2>Mahsulot so‘rovlari</h2><p>Mijoz katalogdan topa olmagan mahsulotlar bo‘yicha so‘rovlar.</p></div><div class="inv-tools"><input id="reqSearch" placeholder="Mahsulot yoki telefon..." oninput="filterRequests()"><select id="reqStatus" onchange="filterRequests()"><option value="">Barcha statuslar</option><option value="new">Yangi</option><option value="working">Ko‘rib chiqilmoqda</option><option value="found">Topildi</option><option value="closed">Yopildi</option></select></div></div><div class="table"><table><thead><tr><th>Sana / №</th><th>Mahsulot</th><th>Mijoz</th><th>Biriktirma</th><th>Izoh</th><th>Status</th><th>Amal</th></tr></thead><tbody id="reqBody">${a.map(r=>`<tr class="req-row" data-search="${esc((r.productName+' '+r.phone+' '+(r.customerName||'')).toLowerCase())}" data-status="${esc(r.status||'new')}"><td>${new Date(r.createdAt).toLocaleString('uz-UZ')}<br><small>${esc(r.requestId)}</small></td><td><b>${esc(r.productName)}</b><br>${Number(r.qty||1)} dona${r.size?` • ${esc(r.size)}`:''}</td><td>${esc(r.customerName||'—')}<br><a href="tel:${esc(r.phone)}">${esc(r.phone)}</a></td><td>${(r.attachment||r.image)?((String(r.attachmentMime||'').startsWith('image/')||String(r.attachment||r.image).startsWith('data:image/'))?`<div class="req-attachment-box"><a href="${r.attachment||r.image}" target="_blank" title="Rasmni kattalashtirish"><img class="inv-img" src="${r.attachment||r.image}"></a><div class="req-attachment-meta"><small>${esc(r.attachmentName||'Rasm')}</small><div class="req-attachment-actions"><a class="btn ghost sm" href="${r.attachment||r.image}" target="_blank">👁 Ko‘rish</a><a class="btn primary sm" href="${r.attachment||r.image}" download="${esc(r.attachmentName||'mahsulot-rasmi')}">⬇ Yuklab olish</a></div></div></div>`:`<div class="req-attachment-box file"><div class="req-file-icon">📎</div><div class="req-attachment-meta"><small>${esc(r.attachmentName||'Biriktirilgan fayl')}</small><div class="req-attachment-actions"><a class="btn ghost sm" href="${r.attachment||r.image}" target="_blank">👁 Ochish</a><a class="btn primary sm" href="${r.attachment||r.image}" download="${esc(r.attachmentName||'biriktirma')}">⬇ Yuklab olish</a></div></div></div>`):'—'}</td><td>${esc(r.comment||'—')}</td><td><select class="status-select" onchange="setRequestStatus('${esc(r.requestId)}',this.value)">${[['new','Yangi'],['working','Ko‘rib chiqilmoqda'],['found','Topildi'],['closed','Yopildi']].map(x=>`<option value="${x[0]}" ${(r.status||'new')===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></td><td><div class="req-actions"><button class="btn danger sm" onclick="deleteProductRequest('${esc(r.requestId)}',this)">🗑 O‘chirish</button></div></td></tr>`).join('')||'<tr><td colspan="7">Hozircha so‘rov yo‘q.</td></tr>'}</tbody></table></div></div>`}
function filterRequests(){const q=($('#reqSearch')?.value||'').toLowerCase(),st=$('#reqStatus')?.value||'';document.querySelectorAll('.req-row').forEach(r=>r.style.display=(!q||r.dataset.search.includes(q))&&(!st||r.dataset.status===st)?'':'none')}

async function deleteProductRequest(id,btn){if(!confirm('Bu mahsulot so‘rovini o‘chirasizmi?'))return;if(btn){btn.disabled=true;btn.textContent='…'}try{await api(`/api/admin/product-requests/${encodeURIComponent(id)}`,{method:'DELETE'});await refresh()}catch(e){if(btn){btn.disabled=false;btn.textContent='🗑 O‘chirish'}alert(e.message)}}

let activeAdminChat='';
function chatsPane(){const chats=(D.chats||[]).slice().sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')));if(!activeAdminChat&&chats[0])activeAdminChat=chats[0].sessionId;const c=chats.find(x=>x.sessionId===activeAdminChat)||chats[0];return `<div class="admin-chat-layout"><div class="panel"><h2 style="margin-top:0">Mijozlar bilan LIVE chat</h2><p class="muted">Saytdagi “Aloqa” bo‘limidan kelgan xabarlar.</p><div class="admin-chat-list">${chats.map(x=>`<div class="admin-chat-list-row"><button class="admin-chat-item ${c?.sessionId===x.sessionId?'active':''}" onclick="openAdminChat('${esc(x.sessionId)}')"><b>${esc(x.name||'Noma’lum mijoz')}${Number(x.unreadAdmin||0)?` <span class="unread-pill">${Number(x.unreadAdmin||0)}</span>`:''}</b><span>${esc(x.phone||'Telefon kiritilmagan')}</span><small>${x.updatedAt?new Date(x.updatedAt).toLocaleString('uz-UZ'):''}</small></button><button class="chat-delete-btn" title="Chatni o‘chirish" onclick="deleteAdminChat('${esc(x.sessionId)}')">🗑</button></div>`).join('')||'<div class="notice">Hozircha chat yo‘q.</div>'}</div>${chats.length?`<button class="btn danger chat-clear-all" onclick="deleteAllAdminChats()">🗑 Barchasini o‘chirish</button>`:''}</div><div class="panel">${c?adminChatThread(c):'<div class="notice">Mijoz yozganda chat shu yerda chiqadi.</div>'}</div></div>`}
function adminChatThread(c){return `<div class="admin-chat-thread"><div><h3 style="margin:0">${esc(c.name||'Mijoz')}</h3><p class="muted" style="margin:4px 0 10px">${esc(c.phone||'Telefon kiritilmagan')} • ${esc(c.sessionId)}</p></div><div id="adminChatMessages" class="admin-chat-messages">${(c.messages||[]).map(m=>`<div class="admin-chat-msg ${m.from==='admin'?'admin':'customer'}">${esc(m.text)}<small>${m.from==='admin'?'Admin':'Mijoz'} • ${new Date(m.createdAt).toLocaleString('uz-UZ')}</small></div>`).join('')||'<div class="muted">Xabar yo‘q.</div>'}</div><form class="admin-chat-reply" onsubmit="sendAdminChat(event,'${esc(c.sessionId)}')"><input id="adminChatInput" maxlength="1200" placeholder="Javob yozing..." required><button class="btn primary">Yuborish</button></form></div>`}
async function openAdminChat(id){activeAdminChat=id;try{await api('/api/admin/chats/'+encodeURIComponent(id)+'/read',{method:'PATCH',body:'{}'});await refresh()}catch(e){console.error(e)}setTimeout(()=>{const b=$('#adminChatMessages');if(b)b.scrollTop=b.scrollHeight},30)}
async function sendAdminChat(e,id){e.preventDefault();const inp=$('#adminChatInput'),message=inp.value.trim();if(!message)return;const b=e.currentTarget.querySelector('button');b.disabled=true;try{await api('/api/admin/chats/'+encodeURIComponent(id)+'/send',{method:'POST',body:JSON.stringify({message})});inp.value='';await refresh();activeAdminChat=id;renderApp();setTimeout(()=>{const box=$('#adminChatMessages');if(box)box.scrollTop=box.scrollHeight},30)}catch(err){alert(err.message)}finally{b.disabled=false}}
async function deleteAdminChat(id){try{await api('/api/admin/chats/'+encodeURIComponent(id),{method:'DELETE'});if(activeAdminChat===id)activeAdminChat='';await refresh();renderApp()}catch(e){alert(e.message)}}
async function deleteAllAdminChats(){try{await api('/api/admin/chats',{method:'DELETE'});activeAdminChat='';await refresh();renderApp()}catch(e){alert(e.message)}}

function filterAdminReviews(){const q=String($('#reviewSearch')?.value||'').toLowerCase().trim(),st=$('#reviewState')?.value||'';document.querySelectorAll('#reviewAdminBody tr[data-review]').forEach(tr=>{tr.style.display=(!q||tr.dataset.search.includes(q))&&(!st||tr.dataset.state===st)?'':'none'})}
async function replyAdminReview(id){const row=(D.productReviews||[]).find(x=>String(x.id)===String(id));const current=String(row?.adminReply||'');const reply=prompt('Admin javobini yozing:',current);if(reply===null)return;if(!reply.trim()){alert('Javob matnini kiriting.');return}try{await api('/api/admin/reviews/'+encodeURIComponent(id)+'/reply',{method:'PATCH',body:JSON.stringify({reply:reply.trim()})});receiptToast('✓ Javob saqlandi');await refresh();currentTab='reviews';renderApp()}catch(e){alert(e.message)}}
async function deleteAdminReview(id){if(!confirm('Bu baho va izohni o‘chirasizmi?'))return;try{await api('/api/admin/reviews/'+encodeURIComponent(id),{method:'DELETE'});receiptToast('✓ Izoh o‘chirildi');await refresh();currentTab='reviews';renderApp()}catch(e){alert(e.message)}}
function productsPane(){return `<div class="panel"><div class="inv-head"><div class="inv-title"><h2>Mahsulotlar</h2><p>Mahsulot kartochkalari, narxlar, UZ/RU ma’lumotlari, birlik, rasm va Excel importni boshqaring.</p></div><div class="inv-tools"><input id="invSearch" placeholder="Mahsulot nomi bo‘yicha qidirish..." oninput="filterInventory()"><select id="invCat" onchange="filterInventory()"><option value="">Barcha kategoriyalar</option>${D.categories.map(c=>`<option value="${c.id}">${esc(c.name?.uz||c.id)}</option>`).join('')}</select><button class="btn ghost" onclick="downloadProductExcelTemplate()">⬇ Excel shablon</button><button class="btn ghost" onclick="document.getElementById('productExcelFile').click()">▣ Excel orqali import</button><input id="productExcelFile" type="file" accept=".xlsx,.xls" hidden onchange="previewProductExcel(this)"><button class="btn primary" onclick="createProductAndOpen()">+ Mahsulot qo‘shish</button></div></div><div class="inv-table-wrap"><table class="inv-table"><thead><tr><th>#</th><th>Kod</th><th>Rasm</th><th>Mahsulot nomi</th><th>Kategoriya</th><th>Sotuv narxi</th><th>Tannarx</th><th>Eski narx</th><th>Zaxira</th><th>Holat</th><th>Amallar</th></tr></thead><tbody id="invBody">${D.products.map((p,i)=>inventoryRow(p,i)).join('')}</tbody></table></div><div class="inv-foot"><span>Jami: ${D.products.length} ta mahsulot</span><span>1</span></div><div class="category-manager"><div class="category-head"><div><h3>Kategoriyalar</h3><p class="muted small">Yangi kategoriya qo‘shing yoki mavjud nomlarini o‘zgartiring.</p></div><button class="btn primary sm" onclick="addCategory()">+ Yangi kategoriya</button></div><div id="categoryRows">${D.categories.map((c,i)=>categoryRow(c,i)).join('')}</div><button class="btn ghost sm" onclick="saveCategories()">Kategoriyalarni saqlash</button></div></div><div class="admin-quick-grid"><section class="admin-quick-card"><h4><span class="quick-check">✓</span>Mahsulot so‘rovlari</h4><p>Sayt va admin paneldagi yangi so‘rovlar</p><div class="quick-metric-row"><div class="quick-metric"><span>Jami</span><b>${(D.productRequests||[]).length}</b></div><div class="quick-metric"><span>Yangi</span><b>${(D.productRequests||[]).filter(x=>x.status==='new').length}</b></div><div class="quick-metric"><span>Chat</span><b>${(D.chats||[]).length}</b></div></div><div class="quick-actions" style="margin-top:10px"><button class="primary" onclick="tab('requests')">So‘rovlarni ochish</button></div></section><section class="admin-quick-card"><h4><span class="quick-check">✓</span>Sayt aloqa ma’lumotlari</h4><p>Telefon va Telegram admin paneldan boshqariladi</p><div style="font-size:12px;line-height:1.9"><b>☎ ${esc(D.settings?.phone||'—')}</b><br><b>➤ ${esc(D.settings?.telegram||'—')}</b></div><div class="quick-actions" style="margin-top:10px"><button class="primary" onclick="tab('pages')">Tahrirlash</button></div></section><section class="admin-quick-card"><h4><span class="quick-check">✓</span>FINANS — Balans</h4><p>Aktiv, passiv va o‘z mablag‘i</p><div class="quick-metric-row"><div class="quick-metric"><span>Aktiv</span><b>${money(D.financeQuick?.balance?.assets||0)}</b></div><div class="quick-metric"><span>Passiv</span><b>${money(D.financeQuick?.balance?.liabilities||0)}</b></div><div class="quick-metric"><span>O‘z mablag‘i</span><b>${money(D.financeQuick?.balance?.equity||0)}</b></div></div><div class="quick-actions" style="margin-top:10px"><button class="primary" onclick="tab('finance')">FINANSni ochish</button></div></section><section class="admin-quick-card"><h4><span class="quick-check">✓</span>PRO prays preview</h4><p>Mahsulotlar prays-listini ko‘rish va PDF</p><div class="quick-actions"><button class="primary" onclick="tab('warehouse');setTimeout(()=>{document.querySelector('[onclick*=openPricePreview]')?.click()},100)">Preview ochish</button><button onclick="tab('warehouse')">Ombor</button></div></section></div><div id="productModalRoot"></div>`}

let pendingProductExcelBuffer=null;
function downloadProductExcelTemplate(){window.location='/api/admin/products-import-template'}
function bytesToBase64(bytes){let s='';const a=new Uint8Array(bytes);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode(...a.subarray(i,i+0x8000));return btoa(s)}
async function previewProductExcel(input){
 const f=input?.files?.[0];if(!f)return;
 if(!/\.xlsx?$/i.test(f.name)){alert('Faqat .xlsx yoki .xls fayl tanlang.');input.value='';return}
 try{
  const buf=await f.arrayBuffer();pendingProductExcelBuffer=buf;
  const r=await fetch('/api/admin/products-import-preview',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:buf});
  const d=await r.json();if(!r.ok)throw new Error(d.error||'Excelni tekshirib bo‘lmadi');
  const root=$('#productModalRoot')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'productModalRoot'}));
  root.innerHTML=`<div class="product-modal"><div class="product-modal-card" style="max-width:1100px"><div class="product-modal-head"><div><h3>Excel import — oldindan ko‘rish</h3><div class="muted small">${esc(f.name)} • ${d.count} qator • ${d.create} yangi • ${d.update} yangilanadi • ${d.errors} xato</div></div><button class="product-modal-close" onclick="closeProductExcelPreview()">×</button></div><div style="overflow:auto;max-height:55vh"><table class="inv-table"><thead><tr><th>Qator</th><th>Kod</th><th>Nomi UZ</th><th>Kategoriya</th><th>Narx</th><th>Miqdor</th><th>Amal</th><th>Xato</th></tr></thead><tbody>${(d.rows||[]).map(x=>`<tr><td>${x.rowNo}</td><td>${esc(x.sku||'—')}</td><td><b>${esc(x.nameUz||'')}</b></td><td>${esc(x.catUz||'Boshqa')}</td><td>${money(x.price||0)}</td><td>${Number(x.qty||0)}</td><td><span class="role-badge">${x.mode==='create'?'YANGI':'YANGILASH'}</span></td><td>${x.errors?.length?`<span style="color:#b42318">${esc(x.errors.join(', '))}</span>`:'✓'}</td></tr>`).join('')}</tbody></table></div><div class="notice" style="margin-top:12px">Mavjud mahsulot SKU yoki aynan bir xil UZ nomi bo‘yicha topiladi. “Omborga miqdor” joriy zaxiraga qo‘shiladi.</div><div class="product-modal-actions"><button class="btn ghost" onclick="closeProductExcelPreview()">Bekor qilish</button><button class="btn primary" ${d.errors===d.count?'disabled':''} onclick="confirmProductExcelImport(this)">Excel importni tasdiqlash</button></div></div></div>`;
 }catch(e){alert(e.message);pendingProductExcelBuffer=null}
 finally{input.value=''}
}
function closeProductExcelPreview(){pendingProductExcelBuffer=null;const r=$('#productModalRoot');if(r)r.innerHTML=''}
async function confirmProductExcelImport(btn){
 if(!pendingProductExcelBuffer){alert('Excel fayl topilmadi');return}
 if(btn){btn.disabled=true;btn.textContent='Import qilinmoqda...'}
 try{
  const r=await fetch('/api/admin/products-import-excel',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:pendingProductExcelBuffer});
  const d=await r.json();if(!r.ok)throw new Error(d.error||'Excel importda xatolik');
  pendingProductExcelBuffer=null;alert(`Import tugadi.\nYangi mahsulot: ${d.created}\nYangilangan: ${d.updated}\nOmborga qo‘shildi: ${d.received}\nO‘tkazib yuborildi: ${d.skipped}`);
  await refresh();currentTab='products';renderApp();
 }catch(e){alert(e.message);if(btn){btn.disabled=false;btn.textContent='Excel importni tasdiqlash'}}
}

function categoryRow(c,i){return `<div class="category-row" data-i="${i}"><input class="cuz" value="${esc(c.name?.uz||'')}" placeholder="Nomi (UZ)"><input class="cru" value="${esc(c.name?.ru||'')}" placeholder="Nomi (RU)"><button class="btn danger sm" onclick="removeCategory(${i})">O‘chirish</button></div>`}

function openProductEditor(id,isNew=false){const p=D.products.find(x=>Number(x.id)===Number(id));if(!p)return;const r=$('#productModalRoot')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'productModalRoot'}));const units=[['dona','шт'],['kg','кг'],['gram','г'],['metr','м'],['litr','л'],['ml','мл'],['quti','коробка'],['paket','пакет']];r.innerHTML=`<div class="product-modal"><div class="product-modal-card"><div class="product-modal-head"><div><h3>${isNew?'Yangi mahsulot qo‘shish':'Mahsulotni tahrirlash'}</h3><div class="muted small">UZ + RU ma’lumotlari va SEO maydonlari Google uchun ishlatiladi.</div></div><button class="product-modal-close" onclick="closeProductEditor(${isNew?'true':'false'},${p.id})">×</button></div><div class="product-modal-grid"><div class="product-modal-photo">${p.image?`<img id="editorProductImage" class="inv-img" src="${p.image}" alt="Mahsulot rasmi">`:`<div id="editorProductImageEmpty" class="inv-img-empty">Rasm yo‘q</div>`}<label class="inv-upload">Rasm tanlash<input type="file" accept="image/jpeg,image/png,image/webp" hidden onchange="setProductImage(${p.id},event)"></label>${p.image?`<button class="photo-remove" onclick="removeProductImageEditor(${p.id})" type="button">Rasmni olib tashlash</button>`:''}</div><label>Mahsulot kodi / SKU<input id="eSku" value="${esc(p.sku||'')}" placeholder="Masalan: M001"></label><label>Mahsulot nomi (UZ)<input id="eName" value="${esc(p.name?.uz||'')}"></label><label>Название товара (RU)<input id="eNameRu" value="${esc(p.name?.ru||'')}"></label><label class="wide">Mahsulot ma’lumoti (UZ)<textarea id="eDescUz" placeholder="Mahsulot haqida ma’lumot...">${esc(p.description?.uz||'')}</textarea></label><label class="wide">Описание товара (RU)<textarea id="eDescRu" placeholder="Описание товара для русскоязычного поиска Google...">${esc(p.description?.ru||'')}</textarea></label><label>Kategoriya<select id="eCat">${D.categories.map(c=>`<option value="${c.id}" ${c.id===p.cat?'selected':' function normalizeProductCanvas(img){
  const max=1200,sw=img.naturalWidth||img.width,sh=img.naturalHeight||img.height,scan=document.createElement('canvas');scan.width=sw;scan.height=sh;const sx=scan.getContext('2d',{willReadFrequently:true});sx.drawImage(img,0,0);let data=sx.getImageData(0,0,sw,sh).data,l=sw,t=sh,r=-1,b=-1;const step=Math.max(1,Math.floor(Math.min(sw,sh)/900));
  for(let y=0;y<sh;y+=step)for(let x=0;x<sw;x+=step){const i=(y*sw+x)*4,a=data[i+3],rr=data[i],gg=data[i+1],bb=data[i+2];if(a>20&&!(rr>246&&gg>246&&bb>246)){if(x<l)l=x;if(x>r)r=x;if(y<t)t=y;if(y>b)b=y}}
  if(r<l||b<t){l=0;t=0;r=sw-1;b=sh-1}const bw=r-l+1,bh=b-t+1,pad=Math.round(Math.max(bw,bh)*.08);l=Math.max(0,l-pad);t=Math.max(0,t-pad);r=Math.min(sw-1,r+pad);b=Math.min(sh-1,b+pad);const cw=r-l+1,ch=b-t+1,side=Math.max(cw,ch),scale=Math.min(1,max/side),outSide=Math.max(1,Math.round(side*scale)),c=document.createElement('canvas');c.width=outSide;c.height=outSide;const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,outSide,outSide);cx.drawImage(img,l,t,cw,ch,(outSide-cw*scale)/2,(outSide-ch*scale)/2,cw*scale,ch*scale);return c
}
function setProductImage(id,e){const file=e.target.files?.[0];if(!file)return;if(!/^image\/(jpeg|png|webp)$/.test(file.type)){alert('Faqat JPG, PNG yoki WEBP rasm tanlang.');e.target.value='';return}if(file.size>8*1024*1024){alert('Rasm 8 MB dan katta bo‘lmasin.');e.target.value='';return}const img=new Image(),reader=new FileReader();reader.onload=()=>{img.onload=()=>{const c=normalizeProductCanvas(img);let data='';try{data=c.toDataURL('image/webp',.88)}catch{data=c.toDataURL('image/jpeg',.90)}const p=D.products.find(x=>Number(x.id)===Number(id));if(p){p.image=data;const old=$('#editorProductImage'),empty=$('#editorProductImageEmpty');if(old)old.src=data;else if(empty){const im=document.createElement('img');im.id='editorProductImage';im.className='inv-img';im.src=data;empty.replaceWith(im)}}};img.onerror=()=>alert('Rasmni o‘qib bo‘lmadi.');img.src=reader.result};reader.readAsDataURL(file)}

function buildPriceMarkup(){const pages=buildPricePages(),logo=pricePdfImage(D.logo||'logo.png'),siteName=esc(D.settings?.siteName||'IMOM OTA BARAKA'),domain=esc(D.settings?.siteDomain||window.location.host||''),phone=esc(D.settings?.phone||''),today=esc(new Date().toLocaleDateString('uz-UZ'));return {pages,markup:`<div class="pro-price-doc">${pages.map((page,idx)=>`<section class="pro-price-page">${idx===0?`<div class="pro-head"><div class="pro-brand"><img class="pro-logo" src="${logo}" alt="Logo"><div><div class="pro-eyebrow">Premium Price List</div><div class="pro-title">${siteName}</div></div></div><div class="pro-datebox"><div class="small">Yangilangan sana</div><b>${today}</b></div></div>`:''}<div class="pro-price-grid" style="${idx===0?'margin-top:7mm':'margin-top:0'}">${page.items.map(priceCardHtml).join('')}</div><div class="pro-footer"><div><b>${siteName}</b>${domain?` • ${domain}`:''}${phone?` • ${phone}`:''}</div><div class="pro-page-no">${idx+1} / ${pages.length}</div></div></section>`).join('')}</div>`}}
function loadRemoteScript(src){return new Promise((resolve,reject)=>{if([...document.scripts].some(s=>s.src===src))return resolve();const s=document.createElement('script');s.src=src;s.async=true;s.onload=resolve;s.onerror=()=>reject(new Error('Skript yuklanmadi: '+src));document.head.appendChild(s)})}
async function ensurePricePdfLibs(){if(window.jspdf&&window.html2canvas)return;if(!window.__pricePdfLibPromise){window.__pricePdfLibPromise=(async()=>{if(!window.html2canvas)await loadRemoteScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js');if(!window.jspdf)await loadRemoteScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js')})().catch(err=>{window.__pricePdfLibPromise=null;throw err})}return window.__pricePdfLibPromise}
function previewPricePdf(){
  try{
    const {markup,pages}=buildPriceMarkup();
    if(!pages.length)throw new Error('Prays uchun mahsulotlar topilmadi.');
    const w=window.open('','_blank');
    if(!w)throw new Error('Preview oynasi brauzer tomonidan bloklandi. Pop-upga ruxsat bering.');try{w.opener=null}catch(_){}
    const css=priceDocumentStyles().replace('</style>',`\nbody{padding:0}.pro-preview-toolbar{position:sticky;top:0;z-index:999;display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;background:#07584c;box-shadow:0 3px 14px rgba(0,0,0,.14)}.pro-preview-toolbar button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.pro-preview-toolbar .print{background:#fff;color:#07584c}.pro-preview-toolbar .close{background:#ffecec;color:#a42828}\n</style>`);
    w.document.open();
    w.document.write(`<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IMOM OTA BARAKA — PRO prays preview</title>${css}</head><body><div class="pro-preview-toolbar"><button class="print" onclick="window.print()">🖨 Chop etish / PDF</button><button class="close" onclick="window.close()">✕ Yopish</button></div>${markup}</body></html>`);
    w.document.close();
    w.focus();
  }catch(e){alert(e&&e.message?e.message:String(e));console.error(e)}
}
async function downloadPricePdf(btn){try{if(btn){btn.disabled=true;btn.dataset.prevText=btn.textContent;btn.textContent='PDF tayyorlanmoqda...'}await ensurePricePdfLibs();const {markup,pages}=buildPriceMarkup();if(!pages.length)throw new Error('Prays uchun mahsulotlar topilmadi.');const root=document.createElement('div');root.style.position='fixed';root.style.left='-20000px';root.style.top='0';root.style.width='297mm';root.style.zIndex='-1';root.innerHTML=priceDocumentStyles()+markup;document.body.appendChild(root);const pageEls=[...root.querySelectorAll('.pro-price-page')];const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4',compress:true});for(let i=0;i<pageEls.length;i++){const canvas=await window.html2canvas(pageEls[i],{scale:2,useCORS:true,backgroundColor:'#eef4f0'});const img=canvas.toDataURL('image/jpeg',0.94);if(i>0)pdf.addPage('a4','landscape');pdf.addImage(img,'JPEG',0,0,297,210,undefined,'FAST')}const stamp=($('#warehouseMonth')?.value||new Date().toISOString().slice(0,7)).replace(/[^0-9-]/g,'');pdf.save(`IMOM_OTA_BARAKA_PRO_PRAYS_${stamp}.pdf`);root.remove()}catch(e){alert((e&&e.message?e.message:e)+'\n\nAgar to‘g‘ridan-to‘g‘ri PDF yuklash ishlamasa, “PRO prays preview” tugmasidan kirib Save as PDF qiling.');console.error(e)}finally{if(btn){btn.disabled=false;btn.textContent=btn.dataset.prevText||'PRO PDF yuklab olish'}}}

function finChart(series){const max=Math.max(1,...(series||[]).flatMap(x=>[Number(x.revenue)||0,Math.max(0,Number(x.netProfit)||0)]));return `<div class="fin-legend"><span><i class="r"></i>Sotuv aylanmasi</span><span><i class="p"></i>Sof natija</span></div><div class="fin-chart">${(series||[]).map((x,i)=>`<div class="fin-chart-col" title="${x.month}: ${finMoney(x.revenue)} / ${finMoney(x.netProfit)}"><div class="fin-bar-rev" style="height:${Math.max(2,(Number(x.revenue)||0)/max*100)}%"></div><div class="fin-bar-profit" style="height:${Math.max(2,Math.max(0,Number(x.netProfit)||0)/max*100)}%"></div><span class="fin-chart-label">${String(i+1).padStart(2,'0')}</span></div>`).join('')}</div>`}
function finCompany(id){return (FIN?.companies||[]).find(x=>String(x.id)===String(id))}
function finProduct(id){return (FIN?.products||D.products||[]).find(x=>Number(x.id)===Number(id))}
function renderFinance(){if(!FIN)return;const root=$('#financeRoot');if(!root)return;const renderers={dashboard:renderFinanceDashboard,purchases:renderFinancePurchases,sales:renderFinanceSales,companies:renderFinanceCompanies,payroll:renderFinancePayroll,taxes:renderFinanceTaxes,expenses:renderFinanceExpenses,receipts:renderFinanceReceipts,reports:renderFinanceReports};root.innerHTML=(renderers[financeSection]||renderFinanceDashboard)()}
function renderFinanceDashboard(){const s=FIN.summary||{},b=FIN.balance||{},year=$('#finYear')?.value||new Date().getFullYear();return `<div class="fin-pane"><div class="fin-kpis"><div class="fin-kpi good"><span>Sotuv aylanmasi</span><b>${finMoney(s.revenue)}</b></div><div class="fin-kpi good"><span>Yalpi foyda</span><b>${finMoney(s.grossProfit)}</b></div><div class="fin-kpi ${Number(s.netProfit)>=0?'good':'bad'}"><span>Sof natija</span><b>${finMoney(s.netProfit)}</b></div><div class="fin-kpi warn"><span>Hisoblangan soliqlar</span><b>${finMoney(s.taxAccrued)}</b></div><div class="fin-kpi"><span>Prixod / Xarid</span><b>${finMoney(s.purchaseTotal)}</b></div><div class="fin-kpi"><span>Ish haqi fondi</span><b>${finMoney(s.payrollGross)}</b></div><div class="fin-kpi warn"><span>Firmalarga qarz</span><b>${finMoney(b.supplierDebt)}</b></div><div class="fin-kpi warn"><span>Soliq qarzi</span><b>${finMoney(b.taxDebt)}</b></div></div><div class="fin-grid2"><div class="fin-card"><div class="fin-section-title"><h3>PRO moliyaviy diagramma — ${esc(year)}</h3><span class="role-badge">12 oy</span></div>${finChart(FIN.series||[])}</div><div class="fin-card"><div class="fin-section-title"><h3>ERP PRO avtomatik balans</h3><span class="role-badge">LIVE</span></div>${financeBalanceHtml(b)}<div class="fin-auto-note" style="margin-top:12px">Sotuv “Yakunlandi” bo‘lganda tushum Finansga avtomatik kiradi. Prixod ombor va firma qarziga, to‘lovlar esa bank/kassa va majburiyatlarga avtomatik ta’sir qiladi.</div></div></div></div>`}
function financeBalanceHtml(b={}){const status=b.balanced!==false;return `<div class="fin-balance-kpis"><div><span>Jami aktiv</span><b>${finMoney(b.assets)}</b></div><div><span>Jami majburiyat</span><b>${finMoney(b.liabilities)}</b></div><div><span>Kapital / Netto</span><b>${finMoney(b.equity)}</b></div><div><span>Jami passiv</span><b>${finMoney(b.passiveTotal??(Number(b.liabilities||0)+Number(b.equity||0)))}</b></div></div><div class="fin-balance-pro"><div class="fin-balance-side"><h4>AKTIVLAR</h4><div class="fin-balance-list"><div class="fin-balance-row"><span>Kassa</span><b>${finMoney(b.cash)}</b></div><div class="fin-balance-row"><span>Bank</span><b>${finMoney(b.bank)}</b></div><div class="fin-balance-row"><span>Ombordagi tovarlar</span><b>${finMoney(b.inventoryValue)}</b></div><div class="fin-balance-row"><span>Debitor qarzdorlik</span><b>${finMoney(b.receivables||0)}</b></div><div class="fin-balance-row"><span>Yetkazib beruvchilarga avans</span><b>${finMoney(b.supplierAdvances||0)}</b></div><div class="fin-balance-row"><span>Soliq / ish haqi avanslari</span><b>${finMoney((b.taxAdvances||0)+(b.payrollAdvances||0))}</b></div><div class="fin-balance-row"><span>Boshqa joriy aktivlar</span><b>${finMoney(b.otherCurrentAssets||0)}</b></div><div class="fin-balance-row fin-balance-total"><span>JAMI AKTIV</span><b>${finMoney(b.assets)}</b></div></div></div><div class="fin-balance-side"><h4>PASSIVLAR</h4><div class="fin-balance-list"><div class="fin-balance-row"><span>Firmalarga qarz</span><b>${finMoney(b.supplierDebt)}</b></div><div class="fin-balance-row"><span>Ish haqi qarzi</span><b>${finMoney(b.payrollDebt)}</b></div><div class="fin-balance-row"><span>Soliq qarzi</span><b>${finMoney(b.taxDebt)}</b></div><div class="fin-balance-row"><span>Boshqa majburiyatlar</span><b>${finMoney(b.otherLiabilities||0)}</b></div><div class="fin-balance-row"><span>Jami majburiyatlar</span><b>${finMoney(b.liabilities)}</b></div><div class="fin-balance-row"><span>Kapital / Netto (avtomatik)</span><b>${finMoney(b.equity)}</b></div><div class="fin-balance-row fin-balance-total"><span>JAMI PASSIV</span><b>${finMoney(b.passiveTotal??(Number(b.liabilities||0)+Number(b.equity||0)))}</b></div></div></div></div><div class="fin-balance-status ${status?'':'bad'}"><div><b>${status?'✓ BALANS TENG':'⚠ BALANSDA FARQ BOR'}</b><div class="fin-note">Aktiv = Majburiyat + Kapital</div></div><b>Farq: ${finMoney(b.balanceDifference||0)}</b></div>`}

function renderFinancePurchases(){const companies=FIN.companies||[],products=FIN.products||[],purchases=FIN.purchases||[],st=FIN.settings||{},today=new Date().toISOString().slice(0,10);return `<div class="fin-pane"><div class="fin-grid2"><div class="fin-card"><div class="fin-toolbar"><h3>Tashkilotdan mahsulot prixod qilish</h3><span class="role-badge">Ombor + Mahsulotlar avtomatik</span></div><div class="fin-form"><label>Yetkazib beruvchi firma<select id="purCompany"><option value="">Firmani tanlang</option>${companies.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><label>Mahsulot<select id="purProduct" onchange="toggleNewPurchaseProduct();calcPurchasePricing()"><option value="">Mahsulotni tanlang</option>${products.map(p=>`<option value="${p.id}">${esc(p.name)} • qoldiq ${p.stock}</option>`).join('')}<option value="__new__">＋ YANGI MAHSULOT — kartochka avtomatik yaratilsin</option></select></label><div id="purNewProductFields" class="fin-new-product wide hidden"><div class="fin-new-product-title"><b>Yangi mahsulot kartochkasi</b><span>Prixod bilan bir vaqtda “Mahsulotlar” bo‘limiga tushadi</span></div><div class="fin-form"><label>Mahsulot nomi (UZ)<input id="purNewNameUz" placeholder="Masalan: Premium guruch"></label><label>Название товара (RU)<input id="purNewNameRu" placeholder="Например: Премиальный рис"></label><label>Kategoriya<select id="purNewCat">${(D.categories||[]).map(c=>`<option value="${c.id}">${esc(c.name?.uz||c.id)}</option>`).join('')}</select></label><label>Birlik<select id="purNewUnit"><option value="dona|шт">dona / шт</option><option value="kg|кг">kg / кг</option><option value="gram|г">gram / г</option><option value="litr|л">litr / л</option><option value="ml|мл">ml / мл</option><option value="quti|коробка">quti / коробка</option><option value="paket|пакет">paket / пакет</option></select></label><label class="wide">Qisqa tavsif (UZ)<input id="purNewDescUz" placeholder="Google va mahsulot sahifasi uchun"></label><label class="wide">Краткое описание (RU)<input id="purNewDescRu" placeholder="Для Google и страницы товара"></label></div></div><label>Miqdor<input id="purQty" type="number" min="0.001" step="0.001" oninput="calcPurchasePricing()"></label><label>Xarid narxi / 1 birlik<input id="purUnitCost" type="number" min="0" oninput="calcPurchasePricing()"></label><label>Transport<input id="purTransport" type="number" value="0" oninput="calcPurchasePricing()"></label><label>Boshqa xarajat<input id="purExtra" type="number" value="0" oninput="calcPurchasePricing()"></label><label>Ustama %<input id="purMarkup" type="number" step="0.01" value="${Number(st.defaultMarkupRate||30)}" oninput="calcPurchasePricing()"></label><label>Sotuv narxi<input id="purSalePrice" type="number" min="0" placeholder="Avtomatik hisoblanadi"></label><label>Boshlang‘ich to‘lov<input id="purPaid" type="number" value="0"></label><label>To‘lov hisobi<select id="purAccount"><option value="bank">Bank</option><option value="cash">Kassa</option></select></label><label>Sana<input id="purDate" type="date" value="${today}"></label><label>Nakladnoy / hujjat №<input id="purInvoice"></label><label class="wide">Izoh<input id="purNote" placeholder="Ixtiyoriy izoh"></label><button class="btn primary wide" onclick="addFinancePurchase()">+ Prixodni saqlash</button></div><div id="purCalc" class="fin-price-preview" style="margin-top:12px"><div><span>Jami xarid</span><b>0 so‘m</b></div><div><span>1 birlik tannarx</span><b>0 so‘m</b></div><div><span>Tavsiya sotuv</span><b>0 so‘m</b></div><div><span>Yangi qoldiq</span><b>0</b></div></div><div class="fin-auto-note" style="margin-top:12px">Mavjud mahsulot tanlansa kartochka qoldig‘i/tannarxi/narxi yangilanadi. “YANGI MAHSULOT” tanlansa kartochka avtomatik yaratiladi, Google SEO sahifasi va sitemap.xml ga ham avtomatik kiradi.</div></div><div class="fin-card"><h3>So‘nggi prixodlar</h3><div class="fin-table"><table><thead><tr><th>Sana</th><th>Firma</th><th>Mahsulot</th><th>Miqdor</th><th>Xarid narxi</th><th>Sotuv narxi</th><th>Jami</th><th>Hujjat</th></tr></thead><tbody>${purchases.slice(0,100).map(x=>{const c=finCompany(x.companyId),p=finProduct(x.productId);return `<tr><td>${esc(x.date||'')}</td><td>${esc(c?.name||'')}</td><td><b>${esc(p?.name||x.productName||'')}</b></td><td>${x.qty} ${esc(p?.unit||x.unit||'')}</td><td>${finMoney(x.unitCost)}</td><td>${finMoney(x.salePrice||x.suggestedSalePrice)}</td><td>${finMoney(x.total)}</td><td>${esc(x.invoice||'—')}</td></tr>`}).join('')||'<tr><td colspan="8" class="fin-empty">Prixod yo‘q</td></tr>'}</tbody></table></div></div></div></div>`}
function toggleNewPurchaseProduct(){const box=$('#purNewProductFields'),isNew=$('#purProduct')?.value==='__new__';if(box)box.classList.toggle('hidden',!isNew);if(isNew&&$('#purNewNameUz'))setTimeout(()=>$('#purNewNameUz')?.focus(),20)}
function calcPurchasePricing(){const qty=Number($('#purQty')?.value)||0,cost=Number($('#purUnitCost')?.value)||0,tr=Number($('#purTransport')?.value)||0,ex=Number($('#purExtra')?.value)||0,markup=Number($('#purMarkup')?.value)||0,isNew=$('#purProduct')?.value==='__new__',p=isNew?null:finProduct($('#purProduct')?.value),total=qty*cost+tr+ex,landed=qty>0?total/qty:0,suggested=Math.round(landed*(1+markup/100)),newStock=Number(p?.stock||0)+qty;if($('#purSalePrice')&&!Number($('#purSalePrice').value))$('#purSalePrice').value=suggested||'';const r=$('#purCalc');if(r)r.innerHTML=`<div><span>Jami xarid</span><b>${finMoney(total)}</b></div><div><span>1 birlik tannarx</span><b>${finMoney(landed)}</b></div><div><span>Tavsiya sotuv</span><b>${finMoney(suggested)}</b></div><div><span>${isNew?'Boshlang‘ich qoldiq':'Yangi qoldiq'}</span><b>${newStock}</b></div>`}
function renderFinanceSales(){const sales=FIN.sales||[];const rows=[];for(const o of sales)for(const it of o.items||[])rows.push({order:o.orderId,date:o.date,status:o.status,customer:o.customer,...it});const totalQty=rows.reduce((a,x)=>a+Number(x.qty||0),0),rev=rows.reduce((a,x)=>a+Number(x.amount||0),0),cogs=rows.reduce((a,x)=>a+Number(x.costAmount||0),0);return `<div class="fin-pane"><div class="fin-total-box"><div><span>Avtomatik rashod miqdori</span><b>${totalQty}</b></div><div><span>Sotuv summasi</span><b>${finMoney(rev)}</b></div><div><span>Tannarx summasi</span><b>${finMoney(cogs)}</b></div><div><span>Taxminiy yalpi foyda</span><b>${finMoney(rev-cogs)}</b></div></div><div class="fin-card"><div class="fin-toolbar"><h3>Sotuv / Rashod jurnali</h3><span class="role-badge">Buyurtmalardan avtomatik</span></div><div class="fin-auto-note">Bu bo‘limga ma’lumot qo‘lda kiritilmaydi. Buyurtma “Yetkazilmoqda” holatiga o‘tganda ombor rashodi avtomatik yoziladi. Moliyaviy tushum xaridor tasdiqlab “Yakunlandi” bo‘lganda hisoblanadi.</div><div class="fin-table" style="margin-top:12px"><table><thead><tr><th>Sana</th><th>Buyurtma</th><th>Mijoz</th><th>Mahsulot</th><th>Miqdor</th><th>Sotuv narxi</th><th>Summa</th><th>Status</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.date||'')}</td><td>${esc(x.order)}</td><td>${esc(x.customer||'')}</td><td><b>${esc(x.name||'')}</b></td><td>${x.qty} ${esc(x.unit||'')}</td><td>${finMoney(x.salePrice)}</td><td>${finMoney(x.amount)}</td><td><span class="fin-sales-status ${x.status}">${['completed','done'].includes(x.status)?'Yakunlandi':(x.status==='delivered'?'Yetkazildi':'Yetkazilmoqda')}</span></td></tr>`).join('')||'<tr><td colspan="8" class="fin-empty">Tanlangan davrda sotuv/rashod yo‘q</td></tr>'}</tbody></table></div></div></div>`}
function renderFinanceCompanies(){const companies=FIN.companies||[],today=new Date().toISOString().slice(0,10),year=today.slice(0,4);return `<div class="fin-pane"><div class="fin-grid2"><div class="fin-card"><h3>Firmalar / Yetkazib beruvchilar</h3><div class="fin-form"><label>Firma nomi<input id="coName"></label><label>STIR / INN<input id="coInn"></label><label>Telefon<input id="coPhone"></label><label>Izoh<input id="coNote"></label><button class="btn primary wide" onclick="addFinanceCompany()">+ Firma qo‘shish</button></div><div class="fin-table" style="margin-top:12px"><table><thead><tr><th>Firma</th><th>Olingan</th><th>To‘langan</th><th>Qarz</th></tr></thead><tbody>${companies.map(c=>`<tr><td><b>${esc(c.name)}</b><br><span class="muted">${esc(c.inn||'')}</span></td><td>${finMoney(c.purchases)}</td><td>${finMoney(c.paid)}</td><td><b>${finMoney(c.debt)}</b></td></tr>`).join('')||'<tr><td colspan="4" class="fin-empty">Firma yo‘q</td></tr>'}</tbody></table></div></div><div class="fin-card"><h3>Firmaga to‘lov</h3><div class="fin-form"><label>Firma<select id="payCompany">${companies.map(c=>`<option value="${c.id}">${esc(c.name)} — qarz ${finMoney(c.debt)}</option>`).join('')}</select></label><label>Summa<input id="payCompanyAmount" type="number"></label><label>Sana<input id="payCompanyDate" type="date" value="${today}"></label><label>Hisob<select id="payCompanyAccount"><option value="bank">Bank</option><option value="cash">Kassa</option></select></label><label class="wide">Izoh<input id="payCompanyNote"></label><button class="btn primary wide" onclick="addCompanyPayment()">To‘lovni saqlash</button></div><hr style="border:0;border-top:1px solid #e4ece8;margin:18px 0"><h3>Akt sverka</h3><div class="fin-form"><label>Firma<select id="reconCompany">${companies.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><label>Boshlanish<input id="reconFrom" type="date" value="${year}-01-01"></label><label>Tugash<input id="reconTo" type="date" value="${today}"></label><button class="btn primary wide" onclick="downloadReconciliation()">Akt sverka Excel yuklash</button></div><div class="fin-auto-note" style="margin-top:12px">Akt sverka firmadan olingan barcha prixodlarni debet, firmaga qilingan to‘lovlarni kredit qilib ko‘rsatadi va davr oxiridagi qarzni avtomatik chiqaradi.</div></div></div></div>`}
function renderFinancePayroll(){const employees=FIN.employees||[],payroll=FIN.payroll||[],month=$('#finMonth')?.value||new Date().toISOString().slice(0,7),today=new Date().toISOString().slice(0,10);return `<div class="fin-pane"><div class="fin-grid2"><div class="fin-card"><h3>Ishchilar ro‘yxati</h3><div class="fin-form"><label>F.I.Sh.<input id="empName"></label><label>Lavozim<input id="empPosition"></label><label>Oylik<input id="empSalary" type="number"></label><label>Telefon<input id="empPhone"></label><label>Ishga kirgan sana<input id="empStarted" type="date" value="${today}"></label><button class="btn primary wide" onclick="addEmployee()">+ Ishchi qo‘shish</button></div><div class="fin-table" style="margin-top:12px"><table><thead><tr><th>F.I.Sh.</th><th>Lavozim</th><th>Oylik</th><th>Holat</th><th>Amal</th></tr></thead><tbody>${employees.map(e=>`<tr><td><b>${esc(e.name)}</b><br><span class="muted">${esc(e.phone||'')}</span></td><td>${esc(e.position||'')}</td><td>${finMoney(e.salary)}</td><td><span class="${e.active===false?'fin-badge-off':'fin-badge-active'}">${e.active===false?'Ishdan bo‘shagan':'Faol'}</span></td><td><div class="fin-row-actions"><button onclick="editEmployee('${e.id}')">Tahrirlash</button>${e.active===false?`<button onclick="toggleEmployee('${e.id}',true)">Faollashtirish</button>`:`<button class="warn" onclick="toggleEmployee('${e.id}',false)">Ishdan bo‘shatish</button>`}<button class="zero" onclick="resetEmployee('${e.id}')">0 qilish</button><button class="danger" onclick="deleteEmployee('${e.id}')">O‘chirish</button><button class="danger" onclick="forceDeleteEmployee('${e.id}')">Tarixi bilan tozalash</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="fin-empty">Ishchi yo‘q</td></tr>'}</tbody></table></div></div><div class="fin-card"><div class="fin-toolbar"><h3>Oylik shakllantirish</h3><span class="role-badge">Faol ishchilar</span></div><div class="fin-form"><label class="wide">Oy<input id="payrollMonth" type="month" value="${mon function salesAnalyticsPane(){const a=D.salesIntelligence||{},src=a.sources||{},top=a.topProducts||[],low=a.lowProducts||[],stagnant=a.stagnant||[],lowStock=a.lowStock||[],sourceRows=[['web','Sayt'],['app','Ilova'],['legacy','Eski / aniqlanmagan']],maxOrders=Math.max(1,...sourceRows.map(x=>Number(src[x[0]]?.orders||0)));const table=(rows,mode)=>`<div style="overflow:auto"><table class="ana-table"><thead><tr><th>Mahsulot</th><th>Sotildi</th><th>Daromad</th><th>Qoldiq</th><th>Oxirgi savdo</th>${mode==='risk'?'<th>Holat</th>':''}</tr></thead><tbody>${rows.slice(0,20).map(x=>`<tr><td><b>${esc(x.name||'')}</b></td><td>${Number(x.soldQty||0)}</td><td>${money(x.soldAmount||0)}</td><td>${Number(x.stock||0)}</td><td>${x.lastSaleAt?new Date(x.lastSaleAt).toLocaleDateString('uz-UZ'):(x.soldQty?'—':'Sotilmagan')}</td>${mode==='risk'?`<td>${x.risk==='stagnant'?'<span class="risk-badge risk-stagnant">Qolib ketmoqda</span>':x.risk==='low-stock'?'<span class="risk-badge risk-low">Kam qoldiq</span>':'—'}</td>`:''}</tr>`).join('')||'<tr><td colspan="6">Ma’lumot yo‘q</td></tr>'}</tbody></table></div>`;return `<div><div class="inv-head"><div class="inv-title"><h2>📊 Savdo analitikasi</h2><p>Sayt va ilova buyurtmalari, mahsulot aylanishi va ombor xavflari bir joyda.</p></div><div class="role-badge">LIVE ANALYTICS</div></div><div class="analytics-kpis"><div class="analytics-kpi"><span>Sotilgan dona</span><b>${Number(a.soldQty||0)}</b></div><div class="analytics-kpi"><span>Sotuv summasi</span><b>${money(a.soldAmount||0)}</b></div><div class="analytics-kpi"><span>Ombor qiymati</span><b>${money(a.inventoryValue||0)}</b></div><div class="analytics-kpi"><span>Sotilgan mahsulot turlari</span><b>${Number(a.activeProducts||0)}</b></div><div class="analytics-kpi"><span>Umuman sotilmagan</span><b>${Number(a.noSaleProducts||0)}</b></div><div class="analytics-kpi"><span>Qolib ketayotgan</span><b>${stagnant.length}</b></div></div><div class="analytics-grid"><section class="analytics-card"><h3>Buyurtma function notificationsPane(){const rows=D.appNotifications||[];const kindLabel={info:'Ma’lumot',sale:'Aksiya',delivery:'Yetkazib berish',news:'Yangilik'};return `<div><div class="inv-head"><div class="inv-title"><h2>🔔 Ilovaga xabar yuborish</h2><p>Bu yerda yozilgan xabar Android ilovaning “Xabarlar” bo‘limida barcha foydalanuvchilarga ko‘rinadi. Ilova ochiq bo‘lsa yangi xabar haqida tizim bildirishnomasi ham chiqadi.</p></div><span class="role-badge">APP MESSAGES</span></div><div class="message-compose"><section class="message-card"><h3>Yangi xabar</h3><div class="message-field"><label>Xabar turi</label><select id="msgKind"><option value="info">ℹ Ma’lumot</option><option value="sale">% Aksiya / chegirma</option><option value="delivery">🚚 Yetkazib berish</option><option value="news">● Yangilik</option></select></div><div class="message-field"><label>Sarlavha — O‘zbekcha *</label><input id="msgTitleUz" maxlength="160" placeholder="Masalan: Yangi aksiya boshlandi"></div><div class="message-field"><label>Matn — O‘zbekcha *</label><textarea id="msgBodyUz" maxlength="1200" placeholder="Xabar matnini yozing..."></textarea></div><div class="message-field"><label>Havola (ixtiyoriy)</label><input id="msgActionUrl" placeholder="https://zarbuloq.uz yoki ilova havolasi"></div><label class="toggle-line"><span>⭐ Muhim xabar</span><input id="msgImportant" type="checkbox"></label></section><section class="message-card"><h3>Tarjimalar</h3><div class="message-field"><label>Русский — заголовок</label><input id="msgTitleRu" maxlength="160" placeholder="Если пусто — используется узбекский"></div><div class="message-field"><label>Русский — текст</label><textarea id="msgBodyRu" maxlength="1200"></textarea></div><button class="btn primary" style="width:100%" onclick="sendAppNotification(this)">➤ Ilovaga xabar yuborish</button></section></div><section class="message-card"><div class="inv-head" style="margin-bottom:8px"><div class="inv-title"><h3>Yuborilgan xabarlar</h3><p>${rows.length} ta xabar</p></div></div><div class="message-history">${rows.length?rows.map(x=>`<div class="message-row"><span class="message-kind">${kindLabel[x.kind]||'Ma’lumot'}</span><div><b>${esc(x.title?.uz||x.title||'')}</b><small>${esc(x.body?.uz||x.body||'')}</small></div><div><b>${x.active===false?'O‘chiq':'Faol'}</b><small>${x.createdAt?new Date(x.createdAt).toLocaleString('uz-UZ'):''}</small></div><div class="req-actions"><button class="btn ghost sm" onclick="toggleAppNotification('${esc(x.id)}',${x.active===false?'true':'false'})">${x.active===false?'Yoqish':'O‘chirish'}</button><button class="btn danger sm" onclick="deleteAppNotification('${esc(x.id)}',this)">🗑 O‘chirish</button></div></div>`).join(''):'<div class="notice">Hali ilovaga xabar yuborilmagan.</div>'}</div></section></div>`}
async function sendAppNotification(btn){const body={kind:$('#msgKind').value,titleUz:$('#msgTitleUz').value.trim(),bodyUz:$('#msgBodyUz').value.trim(),titleRu:$('#msgTitleRu').value.trim(),bodyRu:$('#msgBodyRu').value.trim(),actionUrl:$('#msgActionUrl').value.trim(),important:$('#msgImportant').checked};if(!body.titleUz||!body.bodyUz){alert('O‘zbekcha sarlavha va xabar matnini kiriting.');return}if(btn){btn.disabled=true;btn.textContent='Yuborilmoqda…'}try{await api('/api/admin/app-notifications',{method:'POST',body:JSON.stringify(body)});receiptToast('✓ Xabar ilovaga yuborildi');await refresh()}catch(e){alert(e.message);if(btn){btn.disabled=false;btn.textContent='➤ Ilovaga xabar yuborish'}}}
async function toggleAppNotification(id,active){try{await api('/api/admin/app-notifications/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({active})});await refresh()}catch(e){alert(e.message)}}
async function deleteAppNotification(id,btn){if(!confirm('Bu xabarni butunlay o‘chirasizmi?'))return;if(btn)btn.disabled=true;try{await api('/api/admin/app-notifications/'+encodeURIComponent(id),{method:'DELETE'});await refresh()}catch(e){if(btn)btn.disabled=false;alert(e.message)}}

e">${Number(a.apkVersionCode||a.latestVersionCode||0)||'—'}</b></div><div class="apk-meta"><span>Fayl holati</span><b id="apkInfoState">${a.apkAvailable?'✅ Yuklangan':'⏳ APK yo‘q'}</b></div><div class="apk-meta"><span>Oxirgi yangilanish</span><b id="apkInfoUpdated">${a.apkUpdatedAt?new Date(a.apkUpdatedAt).toLocaleString('uz-UZ'):'—'}</b></div></div><div class="form-grid"><div class="app-field"><label>APK versiyasi (masalan 5.0.7)</label><input id="apkUploadVersion" value="${esc(a.apkVersion||a.currentVersion||'')}"></div><div class="app-field"><label>Version code</label><input id="apkUploadCode" type="number" min="1" value="${Number(a.apkVersionCode||a.latestVersionCode||0)||''}"></div><div class="app-field wide"><label>Yangilanish haqida</label><textarea id="apkUploadNotes" class="apk-notes" placeholder="Masalan: Telegram tasdiqlash, lokatsiya va yangi ikonka...">${esc(a.apkNotes||'')}</textarea></div></div><div id="apkDrop" class="apk-drop" onclick="document.getElementById('apkFileInput').click()" ondragover="apkDrag(event,true)" ondragleave="apkDrag(event,false)" ondrop="apkDropFile(event)"><b>APK faylni shu yerga tashlang yoki bosing</b><div class="muted small" style="margin-top:5px">Faqat .apk • maksimum 250 MB</div><input id="apkFileInput" type="file" accept=".apk,application/vnd.android.package-archive" hidden onchange="selectApkFile(event)"><div id="apkSelected" class="apk-fileline"></div><div class="apk-progress"><i id="apkProgressBar"></i></div></div><div class="apk-actions"><button class="btn primary" id="apkUploadBtn" type="button" onclick="uploadApkFromAdmin()">⬆ Yangi APKni saytga chiqarish</button><a class="btn ghost" href="/downloads/Zarbuloq.apk" target="_blank">↓ Hozirgi APKni tekshirish</a>${a.apkAvailable?`<button class="btn danger" type="button" onclick="deleteSiteApk()">APKni o‘chirish</button>`:''}</div><div class="notice" style="margin-top:10px"><b>Muhim:</b> APK <code>DATA_DIR/downloads/Zarbuloq.apk</code> ga saqlanadi. Render’da persistent disk / DATA_DIR saqlanadigan joy bo‘lishi kerak; aks holda server qayta ishga tushganda fayl yo‘qolishi mumkin.</div></section><section class="app-card app-media-card"><div class="app-media-head"><div><h3 style="margin:0">Bosh sahifa asosiy banneri</h3><p class="muted" style="margin:4px 0 0">Ilovadagi katta bosh banner rasmini va yozuvlarini shu yerdan almashtiring.</p></div>${a.homeHeroImage?`<button class="btn danger sm" type="button" onclick="removeHomeHeroImage()">Rasmni olib tashlash</button>`:''}</div><div style="display:grid;grid-template-columns:minmax(240px,360px) 1fr;gap:16px;align-items:start"><div>${a.homeHeroImage?`<img src="${esc(a.homeHeroImage)}" style="width:100%;height:190px;object-fit:cover;border-radius:16px;border:1px solid #dbe8e1">`:`<div class="notice" style="height:150px;display:grid;place-items:center">Standart Zarbuloq banneri ishlatilmoqda</div>`}<label class="btn primary app-media-upload" style="margin-top:10px">Banner rasmini tanlash<input type="file" accept="image/jpeg,image/png,image/webp" onchange="setHomeHeroImage(event)"></label></div><div><div class="app-field"><label>Banner sarlavhasi</label><input id="appHeroTitle" value="${esc(a.homeHeroTitle||'')}"></div><div class="app-field"><label>Badge / kichik yozuv</label><input id="appHeroBadge" value="${esc(a.homeHeroBadge||'')}"></div><div class="app-field"><label>So‘rov tugmasi matni</label><input id="appHeroButton" value="${esc(a.homeHeroButton||'')}"></div><div class="notice">Rasm o‘zgartirilsa ilovani qayta build qilish shart emas — admin paneldan saqlangandan keyin ilova serverdan oladi.</div></div></div></section><section class="app-card app-media-card"><div class="app-media-head"><div><h3 style="margin:0">Ilova reklama / aksiya rasmlari</h3><p class="muted" style="margin:4px 0 0">24 tagacha rasm qo‘shish mumkin. Reklama, skidka, yangilik va boshqa bannerlar uchun.</p></div><div style="display:flex;gap:8px;align-items:center"><span class="app-media-count">${a.appBanners.length}/24</span>${a.appBanners.length<24?`<label class="btn primary app-media-upload">+ Rasm qo‘shish<input type="file" accept="image/jpeg,image/png,image/webp" onchange="addAppBanner(event)"></label>`:''}</div></div><div class="app-media-grid">${a.appBanners.length?a.appBanners.map((x,i)=>`<div class="app-media-item"><img src="${esc(x.image)}" alt="Ilova banner ${i+1}"><div class="app-media-meta"><input value="${esc(x.title||'')}" placeholder="Banner sarlavhasi" oninput="setAppBannerField(${i},'title',this.value)"><select onchange="setAppBannerField(${i},'kind',this.value)"><option value="reklama" ${x.kind==='reklama'?'selected':''}>Reklama</option><option value="aksiya" ${x.kind==='aksiya'?'selected':''}>Aksiya / skidka</option><option value="yangilik" ${x.kind==='yangilik'?'selected':''}>Yangilik</option><option value="boshqa" ${x.kind==='boshqa'?'selected':''}>Boshqa</option></select><label class="toggle-line"><span>Ilovada ko‘rsatish</span><input type="checkbox" ${x.active===false?'':'checked'} onchange="setAppBannerField(${i},'active',this.checked)"></label><div class="app-media-actions"><button class="btn ghost sm" type="button" onclick="moveAppBanner(${i},-1)" ${i===0?'disabled':''}>←</button><button class="btn ghost sm" type="button" onclick="moveAppBanner(${i},1)" ${i===a.appBanners.length-1?'disabled':''}>→</button><button class="btn danger sm" type="button" onclick="removeAppBanner(${i})">Olib tashlash</button></div></div></div>`).join(''):'<div class="notice">Hozircha ilova banneri yo‘q.</div>'}</div></section></div><div class="app-savebar"><button class="btn primary" onclick="saveAppControl()">💾 Ilova sozlamalarini saqlash</button></div></div>`}
function setHomeHeroImage(e){const f=e.target.files?.[0];if(!f)return;optimizeAppBannerFile(f,data=>{D.settings=D.settings||{};D.settings.appControl=D.settings.appControl||{};D.settings.appControl.homeHeroImage=data;renderPane()})}
function removeHomeHeroImage(){D.settings=D.settings||{};D.settings.appControl=D.settings.appControl||{};D.settings.appControl.homeHeroImage='';renderPane()}
function appBanners(){D.settings=D.settings||{};D.settings.appControl=D.settings.appControl||{};D.settings.appControl.appBanners=Array.isArray(D.settings.appControl.appBanners)?D.settings.appControl.appBanners:[];return D.settings.appControl.appBanners}
function optimizeAppBannerFile(file,done){if(!file)return;if(!/^image\/(jpeg|png|webp)$/i.test(file.type)){alert('Faqat JPG, PNG yoki WEBP rasm.');return}if(file.size>8*1024*1024){alert('Rasm 8 MB dan katta bo‘lmasin.');return}const rd=new FileReader(),img=new Image();rd.onload=()=>{img.onload=()=>{const maxW=1400,maxH=800,scale=Math.min(1,maxW/img.width,maxH/img.height),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);done(c.toDataURL('image/jpeg',.76))};img.src=rd.result};rd.readAsDataURL(file)}
function addAppBanner(e){const f=e.target.files?.[0],a=appBanners();if(!f)return;if(a.length>=24){alert('Maksimum 24 ta rasm mumkin.');return}optimizeAppBannerFile(f,data=>{a.push({id:'app-banner-'+Date.now(),title:'',kind:'reklama',active:true,image:data});renderPane()})}
function setAppBannerField(i,k,v){const a=appBanners();if(a[i])a[i][k]=v}
function removeAppBanner(i){appBanners().splice(i,1);renderPane()}
function moveAppBanner(i,d){const a=appBanners(),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];renderPane()}
let selectedApkFile=null;
function humanFileSize(n){n=Number(n||0);if(!n)return '—';const u=['B','KB','MB','GB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`}
function apkDrag(e,on){e.preventDefault();document.getElementById('apkDrop')?.classList.toggle('drag',!!on)}
function apkDropFile(e){e.preventDefault();apkDrag(e,false);const f=e.dataTransfer?.files?.[0];if(f)setSelectedApkFile(f)}
function selectApkFile(e){const f=e.target.files?.[0];if(f)setSelectedApkFile(f)}
function setSelectedApkFile(f){if(!f)return;if(!/\.apk$/i.test(f.name)){alert('Faqat .apk fayl tanlang.');return}if(f.size>250*1024*1024){alert('APK 250 MB dan katta bo‘lmasligi kerak.');return}selectedApkFile=f;const box=document.getElementById('apkSelected');if(box)box.innerHTML=`<span class="role-badge">${esc(f.name)}</span><b>${humanFileSize(f.size)}</b>`}
function uploadApkFromAdmin(){if(!selectedApkFile){alert('Avval APK faylni tanlang.');return}const version=document.getElementById('apkUploadVersion')?.value.trim()||'',code=document.getElementById('apkUploadCode')?.value||'',notes=document.getElementById('apkUploadNotes')?.value||'',btn=document.getElementById('apkUploadBtn'),bar=document.getElementById('apkProgressBar'),session=sessionStorage.getItem('zarbuloq_admin_session')||'';if(!version){alert('APK versiyasini kiriting.');return}btn.disabled=true;btn.textContent='Yuklanmoqda...';if(bar)bar.style.width='4%';const xhr=new XMLHttpRequest();xhr.open('PUT','/api/admin/app-apk');xhr.withCredentials=true;xhr.setRequestHeader('Content-Type','application/vnd.android.package-archive');if(session)xhr.setRequestHeader('X-Admin-Session',session);xhr.setRequestHeader('X-App-Version',version);xhr.setRequestHeader('X-App-Version-Code',String(code||0));xhr.setRequestHeader('X-App-Notes',encodeURIComponent(notes));xhr.upload.onprogress=e=>{if(e.lengthComputable&&bar)bar.style.width=Math.max(4,Math.round(e.loaded/e.total*100))+'%'};xhr.onload=async()=>{btn.disabled=false;btn.textContent='⬆ Yangi APKni saytga chiqarish';if(xhr.status>=200&&xhr.status<300){if(bar)bar.style.width='100%';showAdminToast('✓ APK saytga chiqarildi');selectedApkFile=null;await refresh();currentTab='appcontrol';renderApp()}else{let msg='APK yuklashda xatolik';try{msg=JSON.parse(xhr.responseText).error||msg}catch{}alert(msg);if(bar)bar.style.width='0'}};xhr.onerror=()=>{btn.disabled=false;btn.textContent='⬆ Yangi APKni saytga chiqarish';if(bar)bar.style.width='0';alert('Serverga APK yuborib bo‘lmadi.')};xhr.send(selectedApkFile)}
async function deleteSiteApk(){if(!confirm('Saytdagi APK faylni o‘chirasizmi?'))return;try{await api('/api/admin/app-apk',{method:'DELETE'});showAdminToast('APK o‘chirildi');await refresh();currentTab='appcontrol';renderApp()}catch(e){alert(e.message)}}

function slidesPane(){const slides=Array.isArray(D.settings.heroSlides)?D.settings.heroSlides:[];return `<div class="panel"><div class="slider-admin-head"><div><h2 style="margin:0">Bosh sahifa slayderi</h2><p class="muted">Parkent tabiatini ko‘rsatish uchun maksimum 5 ta rasm. Rasmlar saytning yuqori qismida avtomatik almashib turadi.</p></div>${slides.length<5?`<label class="btn primary slider-upload-btn">+ Yangi rasm qo‘shish<input type="file" accept="image/jpeg,image/png,image/webp" onchange="addHeroSlide(event)"></label>`:''}</div><div class="slider-admin-grid">${slides.length?slides.map((x,i)=>`<div class="slider-admin-row"><div class="slide-order">${i+1}</div><img class="slider-admin-preview" src="${esc(x.image)}" alt="Slayd ${i+1}"><div class="slider-admin-info"><b>Slayd ${i+1}</b><span class="muted">${x.active===false?'O‘chirilgan':'Faol'}</span><div class="slider-admin-actions"><label class="btn ghost sm slider-upload-btn">Rasmni almashtirish<input type="file" accept="image/jpeg,image/png,image/webp" onchange="replaceHeroSlide(event,${i})"></label><button class="btn ghost sm" type="button" onclick="moveHeroSlide(${i},-1)" ${i===0?'disabled':''}>↑</button><button class="btn ghost sm" type="button" onclick="moveHeroSlide(${i},1)" ${i===slides.length-1?'disabled':''}>↓</button><button class="btn ghost sm" type="button" onclick="toggleHeroSlide(${i})">${x.active===false?'Faollashtirish':'O‘chirish'}</button></div></div><button class="btn danger sm" type="button" onclick="removeHeroSlide(${i})">Olib tashlash</button></div>`).join(''):`<div class="slide-empty"><b>Hozircha slayd yo‘q.</b><br>Yuqoridagi “Yangi rasm qo‘shish” orqali rasm yuklang.</div>`}</div><div class="notice slider-tip"><b>Tavsiya:</b> gorizontal rasm ishlating (taxminan 1920×600 yoki 1600×500). JPG, PNG, WEBP. Maksimum 5 ta. Saytda har 5 soniyada navbat bilan almashadi.</div><div class="pages-savebar"><button class="btn primary" onclick="saveHeroSlides()">Slayderni saqlash</button></div></div>`}
function optimizeSlideFile(file,cb){if(!file)return;if(!/^image\/(jpeg|png|webp)$/.test(file.type)){alert('Faqat JPG, PNG yoki WEBP rasm tanlang.');return}if(file.size>12*1024*1024){alert('Rasm 12 MB dan katta bo‘lmasin.');return}const img=new Image(),reader=new FileReader();reader.onload=()=>{img.onload=()=>{const maxW=1920,maxH=900,scale=Math.min(1,maxW/img.width,maxH/img.height),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);let data;try{data=c.toDataURL('image/webp',.86)}catch{data=c.toDataURL('image/jpeg',.88)};cb(data)};img.src=reader.result};reader.readAsDataURL(file)}
function addHeroSlide(e){const f=e.target.files?.[0];if(!f)return;D.settings.heroSlides=Array.isArray(D.settings.heroSlides)?D.settings.heroSlides:[];if(D.settings.heroSlides.length>=5){alert('Maksimum 5 ta rasm mumkin.');return}optimizeSlideFile(f,data=>{D.settings.heroSlides.push({id:'slide-'+Date.now(),image:data,active:true});renderPane()})}
